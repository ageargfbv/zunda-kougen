    <div class="sbody scr" data-id="${id}">${v.script.map((ls, i) => `<section class="sc">
      <button class="sch" data-sseek="${v.scenes[i][0]}"><span class="no">${mmss(v.scenes[i][0])}</span><b>${esc(v.scenes[i][1])}</b></button>
      ${ls.map(([w, t]) => `<p><i class="${w === "めたん" ? "m" : "z"}">${esc(w)}</i><span>${esc(t)}</span></p>`).join("")}</section>`).join("")}</div>`, false, playing === id);
  markScene();
}
function saveSheet(k) {
  sheetKey = k;
  openSheet(`<div class="sheeth"><h2>保存先</h2><button class="ico" data-back aria-label="閉じる">${I.close}</button></div>
    <div class="sbody">
      <div class="fold">${S.folders.map(f => `<label><input type="checkbox" data-fold="${f.id}" ${f.ids.includes(k) ? "checked" : ""}>${esc(f.name)}</label>`).join("")}</div>
      <form class="newf" data-newf><input id="newname" maxlength="20" placeholder="新しいフォルダ" aria-label="新しいフォルダの名前"><button>作る</button></form>
    </div>`, true);
}
function newFolderSheet() {
  sheetKey = null;
  openSheet(`<div class="sheeth"><h2>新しいフォルダ</h2><button class="ico" data-back aria-label="閉じる">${I.close}</button></div>
    <div class="sbody"><form class="newf" data-newf><input id="newname" maxlength="20" placeholder="フォルダの名前" aria-label="フォルダの名前"><button>作る</button></form></div>`, true);
}
function menuSheet(k, ctx) {
  sheetKey = k; sheetCtx = ctx || "";
  const v = byId[keyId(k)], s = isShort(k), f = sheetCtx.startsWith("folder:") ? folderOf(sheetCtx.slice(7)) : null;
  const it = (m, ic, t) => `<button data-m="${m}">${ic}<span>${t}</span></button>`;
  const later = folderOf(LATER);
  openSheet(`<div class="sheeth"><h2 class="sm">${s ? "ショート・" : ""}${name(v)}</h2><button class="ico" data-back aria-label="閉じる">${I.close}</button></div>
    <div class="menu">
      ${sheetCtx === "queue" ? it("unqueue", I.trash, "「次に再生」から外す") : ""}
      ${!s && v.video && sheetCtx !== "queue" && k !== playing ? it("next", I.qnext, "次に再生") + it("last", I.qlast, "最後に再生") : ""}
      ${later && !later.ids.includes(k) ? it("later", I.clock, "［後で見る］に保存") : ""}
      ${it("fav", I.mark(false), "お気に入りリストに保存")}
      ${f ? it("unfolder", I.trash, `［${esc(f.name)}］から削除`) : ""}
      ${s ? "" : it("done", I.check(false), finished(v.id) ? "未視聴に戻す" : seen(v.id) ? "見終わったにする／未視聴に戻す" : "見終わったにする")}
    </div>`, true);
}
function setDone(id, on) {
  if (on) S.prog[id] = Object.assign({ t: 0, d: 0 }, pg(id), { at: Date.now(), done: true });
  else S.prog[id] = { t: 0, d: 0, at: Date.now(), x: 1 };
  markProg(id); flush();
}
function doMenu(m) {
  const k = sheetKey, id = keyId(k), ctx = sheetCtx;
  if (m === "fav") return saveSheet(k);
  if (m === "done" && !finished(id) && seen(id)) {
    return openSheet(`<div class="sheeth"><h2 class="sm">${name(byId[id])}</h2><button class="ico" data-back aria-label="閉じる">${I.close}</button></div>
      <div class="menu"><button data-m="done1">${I.check(false)}<span>見終わったにする</span></button><button data-m="done0">${I.trash}<span>未視聴に戻す</span></button></div>`, true);
  }
  if (m === "next") { queue = [id].concat(queue.filter(x => x !== id)); toast("次に再生します"); }
  else if (m === "last") { queue = queue.filter(x => x !== id).concat(id); toast("最後に再生します"); }
  else if (m === "unqueue") { queue = queue.filter(x => x !== id); }
  else if (m === "later") { const f = folderOf(LATER); if (!f.ids.includes(k)) f.ids.push(k); markLib(); toast("［後で見る］に保存しました"); }
  else if (m === "unfolder") { const f = folderOf(ctx.slice(7)); if (f) { f.ids = f.ids.filter(x => x !== k); markLib(); toast(`［${f.name}］から削除しました`); } }
  else if (m === "done") setDone(id, !finished(id));
  else if (m === "done1") setDone(id, true);
  else if (m === "done0") setDone(id, false);
  back();
}
function playAll(fid) {
  const f = folderOf(fid); if (!f) return;
  const ids = folderItems(f).filter(k => !isShort(k) && byId[k].video);
  if (!ids.length) return;
  queue = ids.slice(1);
  leave(); openPlayer(ids[0], null, false, false);
  const vid = document.getElementById("vid"); if (vid) vid.play().catch(() => {});
}

// ---------- 操作 ----------
document.addEventListener("click", e => {
  if (e.target.id === "scrim") return back();
  const t = e.target.closest("button");
  if (!t) return;
  const d = t.dataset;
  if ("back" in d) back();
  else if ("search" in d) { leave(); searching = true; pushLayer(); render(); const i = document.getElementById("q"); if (i) i.focus(); }
  else if (d.tab) { leave(); tab = d.tab; showAll = false; meView = null; searching = false; render(); }
  else if (d.chip) { homeChip = d.chip; rerender(); }
  else if (d.fchip) { fChip = d.fchip; rerender(); }
  else if (d.ch) { leave(); pickCh = d.ch; if (showAll) back(); else render(); }
  else if ("all" in d) { leave(); showAll = true; pushLayer(); render(); }
  else if ("hist" in d) { leave(); meView = "hist"; pushLayer(); render(); }
  else if (d.folder) { leave(); meView = d.folder; fChip = "すべて"; pushLayer(); render(); }
  else if ("newfolder" in d) newFolderSheet();
  else if ("accts" in d) acctSheet();
  else if (d.acct) { flush(); try { localStorage.setItem(MOCK_ACCT, d.acct); } catch (e) {} location.reload(); }
  else if (d.playall) playAll(d.playall);
  else if (d.more) menuSheet(d.more, d.ctx);
  else if (d.m) doMenu(d.m);
  else if (d.short) {
    leave(); searching = false; meView = null; tab = "shorts";
    scrollMem.shorts = 0; render();
    const box = document.getElementById("shorts"), a = box && box.querySelector(`[data-sid="${d.short}"]`);
    if (a) box.scrollTop = a.offsetTop;
  }
  else if (d.open) {
    const vid = document.getElementById("vid"); if (vid) vid.pause();
    closeSheet(true);
    const inPlayer = !document.getElementById("player").hidden;
    if (!inPlayer) leave();
    openPlayer(d.open, d.at != null ? +d.at : null, d.fs === "1", inPlayer);
  }
  else if (d.seek) {
    const id = sheetKey, vid = document.getElementById("vid");
    closeSheet(true);
    if (playing === id && vid) { vid.currentTime = +d.seek; vid.play().catch(() => {}); }
    else { const inPlayer = !!playing; if (!inPlayer) leave(); openPlayer(id, +d.seek, tab === "shorts" && !inPlayer, inPlayer); }
  }
  else if ("full" in d) goFull();
  else if (d.script) scriptSheet(d.script);
  else if (d.sseek) {
    const vid = document.getElementById("vid");
    if (playing === sheetKey && vid) { vid.currentTime = +d.sseek; vid.play().catch(() => {}); markScene(); }
    else { const id = sheetKey, inPlayer = !!playing; closeSheet(true); if (!inPlayer) leave(); openPlayer(id, +d.sseek, tab === "shorts" && !inPlayer, inPlayer); }
  }
  else if (d.about) about(d.about);
  else if (d.save) saveSheet(d.save);
  else if (d.done) { setDone(d.done, !finished(d.done)); refreshPlayer(); }
  else if ("auto" in d) { S.set.auto = !S.set.auto; markSet(); flush(); refreshPlayer(); }
  else if (d.rate) {
    S.set.rate = +d.rate; markSet(); flush();
    const vid = document.getElementById("vid"); if (vid) vid.playbackRate = S.set.rate;
    document.querySelectorAll("[data-rate]").forEach(b => b.setAttribute("aria-pressed", String(+b.dataset.rate === S.set.rate)));
  }
});
document.addEventListener("input", e => {
  if (e.target.id === "q") { q = e.target.value; document.getElementById("res").innerHTML = results(); }
});
document.addEventListener("change", e => {
  const d = e.target.dataset;
  if (d.fold != null && sheetKey) {
    const f = folderOf(d.fold);
    if (!f) return;
    if (e.target.checked) { if (!f.ids.includes(sheetKey)) f.ids.push(sheetKey); } else f.ids = f.ids.filter(x => x !== sheetKey);
    markLib();
  }
});
document.addEventListener("submit", e => {
  if (!e.target.matches("[data-newf]")) return;
  e.preventDefault();
  const n = document.getElementById("newname").value.trim();
  if (!n) return;
  S.folders.push({ id: "f" + Date.now().toString(36), name: n, ids: sheetKey ? [sheetKey] : [] }); markLib();
  if (sheetKey) saveSheet(sheetKey); else back();
});
render();
connect();
</script>
<script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js'));</script></body></html>
