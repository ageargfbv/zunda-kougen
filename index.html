@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0f130d;
    --surface: #171c14;
    --chip: #232a1f;
    --chip-on: #eef3e8;
    --chip-on-ink: #0f130d;
    --ink: #eef3e8;
    --muted: #9aa692;
    --line: #283024;
    --accent: #8fd17a;
    --accent-soft: #1f2c1a;
    --stage: #000000;
    --sheet: #1b2118;
    --scrim: rgba(0, 0, 0, .6);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0f130d;
  --surface: #171c14;
  --chip: #232a1f;
  --chip-on: #eef3e8;
  --chip-on-ink: #0f130d;
  --ink: #eef3e8;
  --muted: #9aa692;
  --line: #283024;
  --accent: #8fd17a;
  --accent-soft: #1f2c1a;
  --stage: #000000;
  --sheet: #1b2118;
  --scrim: rgba(0, 0, 0, .6);
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: "M PLUS 1p", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
  font-size: 15px;
  line-height: 1.5;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:focus-visible, a:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
input { font-size: 16px; font-family: inherit; }
.app { max-width: 520px; margin-inline: auto; min-height: 100%; padding-bottom: calc(var(--navh) + 6px + var(--navpad)); }

/* 上の帯 */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--bg);
  display: flex; align-items: center; gap: 10px;
  padding: 10px 16px 8px;
}
.logo { display: flex; align-items: center; gap: 8px; font-family: "Dela Gothic One", "M PLUS 1p", sans-serif; font-size: 21px; letter-spacing: .02em; }
.logo i { width: 34px; height: 24px; border-radius: 7px; background: var(--accent); display: grid; place-items: center; }
.logo i::after { content: ""; border-left: 10px solid #fff; border-top: 6px solid transparent; border-bottom: 6px solid transparent; margin-left: 3px; }
.top h1 { font-size: 22px; font-weight: 800; margin: 0; }

/* チップ */
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 4px 16px 12px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; background: var(--chip); border-radius: 9px; padding: 6px 14px; font-weight: 500; font-size: 14px; white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--chip-on); color: var(--chip-on-ink); }
.chip .n { font-variant-numeric: tabular-nums; opacity: .7; margin-left: 4px; font-size: 12px; }

/* サムネイル */
.th {
  position: relative; container-type: inline-size;
  aspect-ratio: 16 / 9; width: 100%; max-width: 100%; overflow: hidden;
  color: #fff; display: flex; flex-direction: column; justify-content: center;
  padding: 7cqw 6cqw 8cqw;
}
.th { --h: 140; }

部門共通費。費目ごとに指示された基準（従業員数・占有面積など）の合計で割り、各部門の数値を掛ける"],["「直接配賦法」","補助部門間の用役授受を無視する。補助部門どうしの提供量は分母に入れず、製造部門ぶんだけで比を作る"],["部門ごとに「…部門については直接作業時間、…部門については機械稼働時間」","第3次集計。割るのはその部門の、指定された基準の合計。同じ表に並ぶ別の時間は使わない"]],"steps":[["どのステップかを決める","第1次＝費目から部門へ。第2次＝補助部門から製造部門へ。第3次＝製造部門から製品（指図書）へ"],["第1次集計で部門費計を出す","部門個別費はそのまま。部門共通費は費目ごとの基準で配る。縦に足して部門費計"],["第2次集計で裏を表へ寄せる","補助部門費を、製造部門への用役の提供量の比で配る。補助部門の列は空になる"],["第3次集計で製品へ配る","部門費÷その部門の基準の合計で部門別の配賦率。各指図書の時間を掛け、部門の数だけ行ができる"]],"why":"部門ごとに製造間接費の発生の仕方（人手か機械か）が違う。部門ごとの基準で配るほうが製品原価が正確になり、部門長の責任も追える","check":"第1次集計後の全部門の横合計と、第2次集計後の製造部門の横合計が一致する（裏から表へ寄せるだけ）","trap":["部門共通費を合計してから1つの基準で配る ―― 費目ごとに指示された基準で配り分ける","直接配賦法なのに補助部門どうしの量まで分母に入れる ―― 製造部門への配賦額が足りず、横合計が合わない","副経営（副産物の加工・包装品の製造）を補助部門と答える ―― 何か作れば製造部門（基準16）"],"skip":[]}]}},{"id":"k6-2","no":"6-2","title":"補助部門費の配賦方法","sub":"工原","ch":6,"probs":["工原6-2"],"w":0.0,"wt":[],"hl":"","acct":"工原","core":{"t":"補助部門どうしの授受を、直接配賦法は無視、階梯式は一方向、簡便法は第1次配賦だけ、連立方程式法は全部考える。下ほど正確","ab":[],"parts":[{"h":null,"judge":[["「補助部門相互の用役授受を無視して計算する方法」","直接配賦法。製造部門ぶんだけで比を作って配る"],["「一方から他方への用役の授受は考慮するが、その反対方向からの…は無視」","階梯式配賦法。順位を決め、先順位から後順位へだけ配る"],["「第１段階配賦のみを考慮…第２段階配賦では無視（直接配賦法と同様）」","相互配賦法（簡便法）。第1次配賦はクロスで両方向、第2次配賦は製造部門だけへ"],["「用役授受の流れを最も正確に計算できる方法」「純粋法」「連続配賦法」","相互配賦法の連立方程式法で解く（残高が0になるまで配り続けた結果と一致する）"]],"steps":[["指示の言葉で方法を決める","補助部門どうしの授受を、無視・一方向・第1次配賦だけ・全部のどれで見るかを問題文の言い回しから決める"],["階梯式は順位を決めて右に置く","他の補助部門への提供先数が多いほうが先順位。同数なら第1次集計額の多いほう。後順位は受けた額を足して製造部門へだけ配る"],["簡便法は2回に分けて配る","第1次配賦は相手の補助部門も含めて配る。補助部門に残った額を、分母を製造部門ぶんに縮めて第2次配賦で配る"],["連立方程式法はx・yを置く","x・y＝配り終えた後の補助部門費。補助部門の列の縦合計で、第1次集計額＋相手から来る分＝x（y）と2本組む"],["代入して製造部門へ配る","x・yに係数を掛けて製造部門への配賦額を出し、縦に足す。x・yを出しただけでは答えではない"]],"why":"補助部門どうしも用役を授受している。残高が0になるまで配り続ける連続配賦法と同じ答えを、式1組で出すのが連立方程式法","check":"製造部門費の合計が、第1次集計後の全部門の合計と一致する（裏から表へ寄せるだけ）","trap":["x・yを製造部門費と置く ―― 置くのは配り終えた後の補助部門費","簡便法の第2次配賦で、分母を第1次配賦と同じにする ―― 配った合計が残額に足りず、横合計が戻らない","階梯式の後順位が、もとの部門費だけを配る ―― 先順位から受けた額を足してから配る"],"skip":["自家消費は指示が無ければ無視 ―― 考慮してもx・yが変わるだけで、製造部門への配賦額は同じ"]}]}},{"id":"k6-3","no":"6-3","title":"部門別の予定配賦と一般部門","sub":"工原","ch":6,"probs":[],"w":0.0,"wt":[],"hl":"","acct":"工原","core":{"t":"下書きは補助部門費配賦表を予算と実際の2枚、次に製造部門ごとのシュラッター図。理論は、共通費は個別費へ、配賦基準の無いものは一般費へ寄せる","ab":[],"parts":[{"h":"予算でステップ1〜3 → 予定配賦率。実際でもう1回 → 差がステップ3の差異","judge":[["資料が「当年度の製造間接費予算」と「当月の実際データ」に分かれている","予算と実際で、ステップ1〜3を2回回す。予算側で予定配賦率、実際側で実際発生額を作って突き合わせる"],["「月間予算は年間の12分の1」「指示のないものについては月間予算と同様」","予算額と基準操業度の両方を12で割る。月の実測が無い配賦基準（従業員数など）は年間と同じ比で配る"],["実際側が「第1次集計後の」各部門費の実際発生額","実際側はステップ2（補助部門費の配賦）から入る。部門共通費を配り直さない"],["「製造部門費は固定予算により管理」","予算線は水平の1本。予算差異＝月間予算－実際発生額、操業度差異＝（AH－NH）×予定配賦率"]],"steps":[["予算で第1次・第2次集計","部門共通費を指示の基準で配り、補助部門費を指示の方法で製造部門へ。製造部門ごとの年間予算が出る"],["部門別の予定配賦率を出す","第2次集計後の年間予算÷その部門の年間基準操業度。月に直すときは分子も分母も12で割る（率は同じ）"],["予定配賦額を先に配る","部門ごとの予定配賦率×当月のその部門の実際操業度。これが先に製品へ配られる"],["実際で第2次集計をやり直す","当月の実測がある基準は実測で、無い基準は年間と同じ比で補助部門費を配り、製造部門の実際発生額を出す"],["部門ごとに差異を分ける","予算の形（固定予算など）に合わせて、製造部門ごとに予算差異と操業度差異に分ける"]],"why":"製造間接費は原則予定配賦（基準33）。先に予定配賦額で製品に配り、後から実際発生額をつかむので、ステップ3でずれる","check":"製造部門ごとに、予算差異＋操業度差異＝予定配賦額－実際発生額","trap":["月に直すとき予算額だけ12で割る ―― 傾き（予定配賦率）が変わってしまう","予定配賦率の分子に第1次集計の部門費を使う ―― 補助部門費を配り終えた第2次集計後の額で割る"],"skip":[]},{"h":"部門共通費は配ると責任がぼやける → 個別費に寄せる。方法は3つ、それぞれ代償つき","judge":[["「部門共通費の個別費化」「原価責任」と問われる","主目的が製品原価の正確な計算から原価管理・責任会計へ移った、を先に言う"]],"steps":[["なぜ嫌われるかを言う","配賦されると原価責任が曖昧になり、部門管理者が発生に無関心になる。個別費なら発生した部門の責任と最初から分かる"],["方法① コストをかけて部門に集計","全部門に電力メーターを付ける。代償は計算経済性"],["方法② 最も適切な部門に集計","福利費を工場管理部門に集めて管理させる。代償は計算の正確性"],["方法③ 部門の設定を工夫","建物部門という架空の部門の個別費にして、特定の部署に責任を負わせる"]],"why":"部門別計算の主目的が、製品原価の正確な計算から原価管理・責任会計へ移った","check":"","trap":[],"skip":[]},{"h":"配賦基準の無い共通費は一般費 → 製造部門を通さず製品へ。例外は3つ","judge":[["工場長給与・守衛費・図書費","一般費。各部門への適当な配賦基準が無いので、一般部門という補助部門にまとめて製品へ直接配賦"],["「製品に直接配賦できる場合」を挙げよ","原価管理のため（消極的）・正確な計算のため（積極的）・計算の簡略化、の3つ"]],"steps":[["一般費を定義する","部門共通費で、工場全般に発生し、各部門に対する適当な配賦基準が得られないもの"],["製造部門を飛ばす理由を言う","配賦されると製造部門長の責任にされる。原価管理のためには配賦されたくない（消極的な理由）"],["直接配賦できる3つの場合を分ける","①工場事務・企画調査・一般部門費＝原価管理（消極的）②設計・検査・包装部門費＝正確な計算（積極的）③その他＝計算の簡略化"]],"why":"","check":"","trap":["一般部門費の製品への直接配賦を「正確な計算のため」と答える ―― 原価管理のため（消極的） で按分する","judge":[["単純総合原価計算に近い方法（等価係数を完成品と仕掛品に適用する方法）","係数2種類なので第2法"],["仕損は工程の終点で発生している","A・Bそれぞれの完成品のみ負担。Aの仕損はAの完成品、Bの仕損はBの完成品へ"]],"steps":[["積数で合算","Bは直接材料費×1.4、加工費×1.2。月初＋当月投入で直接材料費2,620（加工費1,950）"],["平均法で単価","直接材料費1,310,000÷2,620＝@500、加工費1,560,000÷1,950＝@800"],["完成品＋仕損で按分","A完成600＋仕損100、B完成980＋仕損280（直接材料費の積数）に単価を掛ける"]],"why":"第2法は2つのボックスを無理やり1つにまとめるので、仕損の負担先を製品ごとに分けないといけない","check":"","trap":[],"skip":["第1法・第3法の仕損 ―― ボックスが1つか製品ごとに1つずつなので、いつもの度外視法・非度外視法でよい"]},{"h":"等級別は組別の簡便法。組別もできるが手間を避け、係数で一括按分する","judge":[["組別総合原価計算にあっては、…個別原価計算に準じ","組直接費は各組に賦課、組間接費は配賦。「総合原価計算に準じ」は誤り"],["一期間における完成品の総合原価又は一期間の製造費用","完成品の総合原価の按分が第1法、製造費用の按分が第2法か第3法。選択適用で原則と例外の関係ではない"]],"steps":[["厳密さの順に並べる","個別→組別→等級別→単純総合の順に厳密から簡便。第1法が最も単純総合寄り、第3法が組別寄り"],["等級別を使う理由","計算上は組別も適用できるが、同種製品であることから等価係数で一括して計算する（製品ごとに原価を分けて測る手間を省く）"],["基準22の2つの基準","(一)製品の諸性質＝アウトプット基準、(二)物量的数値＝インプット基準"]],"why":"等価係数1：0.7で一括して按分すれば、製品ごとの消費量を測らなくて済む","check":"","trap":[],"skip":[]}]}},{"id":"k12-1","no":"12-1","title":"連産品 4つの按分方法","sub":"工原","ch":12,"probs":["工原12-1"],"w":0.0,"wt":[],"hl":"","acct":"工原","core":{"t":"按分は物量法なら生産量、市価法は売価×生産量、加工ありは見積加工費を引いたNRV。按分後は実際加工費で転がす","ab":[],"parts":[{"h":"物量法は生産量の比で単価が同じに、市価法は分離点の売価の比で利益率がそろう","judge":[["物量法により連産品原価の計算を行っている","結合原価を分離点の生産量（kg）の比で按分する。単位原価はどの連産品も同じになる"],["市価法（狭義）により連産品原価の計算を行っている","正常市価×分離点の生産量の比で按分する。販売数量は按分に使わない"]],"steps":[["第1工程で結合原価を出す","先入先出法のボックスで完成品原価18,000。4つの方法で共通"],["物量法は生産量の比","18,000を60kg対40kgで10,800・7,200。単位原価は両方@180"],["市価法は分離点の売価の比","@200×60kg・@300×40kgの12,000対12,000で按分し9,000ずつ。単価@150・@225"],["販売数量でPLを作る","売上高と売上原価は販売数量50kg・20kgで。物量法は10%と40%、市価法は25%でそろう"]],"why":"市価法は売価の比で原価を配るので、単位原価も売価と同じ2対3になり利益率がそろう","check":"按分に使った数量が分離点の生産量（60kg・40kg）になっているか","trap":["販売数量で按分する ―― 正しくは分離点の生産量（市価法は正常市価×生産量）"],"skip":["方法ごとに第1工程を解き直すこと ―― 結合原価18,000はどの方法でも同じ"]},{"h":"NRV＝正常市価×生産量－正常追加加工費（仕損なし）で按分、実際加工費を足して転がす","judge":[["連産品で、加工の上売却できるもの（基準29）","加工製品の見積売却価額から加工費の見積額を控除した額を正常市価とみなす＝NRV法"],["正常市価を基準に按分（分離後に追加加工あり）","追加加工があれば分離点のNRV（正常市価－見積追加加工費）の比で按分する"],["正常追加加工費と実際追加加工費が両方ある","按分のNRVには正常、按分後の追加加工の工程の原価には実際を使う"]],"steps":[["NRVを出す","A @200×60kg－600＝11,400、B @300×40kg－900＝11,100。加工費は正常（予定）"],["NRVの比で按分","18,000×11,400÷22,500＝9,120、B 8,880"],["追加加工の工程で転がす","按分額を前工程費に入れ、実際加工費660・1,200を足して転がす"],["販売分でPLを作る","A @163×50kg＝8,150、B @252×20kg＝5,040。利益率18.5%と16%でずれる"]],"why":"NRVを出す分離点ではまだ加工していないので、実際の加工費は分からず見積りを使う","check":"NRVの数量が分離点の生産量（仕損があれば仕損を除き評価額を足す）で、加工費が正常（見積）の値になっているか","trap":["NRVに実際加工費を使う ―― 正しくは正常（見積）加工費。実際は按分後の工程で使う","按分額をそのまま最終製品の原価にする ―― 正しくは実際追加加工費を足して転がす"],"skip":["分離後の期末仕掛品・販売数量 ―― この問題のNRVは分離点の生産量60kg・40kgで出すので、在庫の有無は按分額に関係ない"]},{"h":"生産量ベースの表で全体の利益率を出し、各製品に配って結合原価を逆算する","judge":[["修正正味実現可能価額法により連産品原価の計算を行っている","追加加工後も売上総利益率がそろうように、結合原価を逆算で按分する"],["最終完成品の売上総利益率が等しくなるように按分すること","1級の分離点推定価値基準。全体の利益率を各連産品に配って逆算する"]],"steps":[["生産量ベースの表を書く","売上高相当はA 12,000・B 12,000（正常市価×生産量）、正常追加加工費は600・900"],["横合計で全体の利益率","24,000－18,000－1,500＝4,500、4,500÷24,000＝18.75%"],["利益率を配って逆算","各2,250。A 12,000－600－2,250＝9,150、B 12,000－900－2,250＝8,850"],["実際加工費で転がす","A 9,150＋660、B 8,850＋1,200。最終の利益率は18.25%と16.25%"]],"why":"個別加工費があっても利益率をそろえたいので、配った利益から原価を逆に決める","check":"逆算に使った加工費が正常の600・900で、実際の660・1,200になっていないか","trap":["逆算に実際加工費を使う ―― 正しくは正常（見積）追加加工費。実際は按分後の工程で足す"],"skip":[]},{"h":"連産品は価値移転的に計算できず、財務諸表のため負担能力主義の按分を容認","judge":[["結合原価を各連産品に按分する理由を述べよ","主に財務諸表作成目的。按分しなければ売上原価や棚卸資産価額が算定できない"],["連産品と等級製品の相違点を述べよ","連産品は個別生産不可・異種・負担能力主義の等価係数、等級製品は個別生産可・同種・原価発生原因主義"]],"steps":[["原価発生原因主義を言う","原価財の消費を転がして積み上げる価値移転的計算。連産品は連産品ごとの消費量が分からずできない"],["負担能力主義を言う","高く売れるものに高い原価を負担させる価値回収的計算。市価法・NRV法・修正NRV法"],["按分額の限界を言う","原価管理や製品リストラ等の収益性に関する意思決定には役立たない"]],"why":"牛一頭の中のロースだけの餌代は分からないので、売価から逆算して分けるしかない","check":"物量法の位置づけは、講師・MP・1級の表では原価発生原因主義の側（会計士テキストは正確な計算ではないと注記）","trap":[],"skip":[]}]}},{"id":"q12-2","no":"12-2","title":"連産品 仕掛品・減損・仕損と副産物","sub":"工原","ch":12,"probs":["工原12-3","工原12-4","工原12-2"],"w":0.0,"wt":[],"hl":"","acct":"工原","core":{"t":"下書きは追加加工のボックス（仕損は発生点で1か0を刺す）。NRV＝全量加工した売上−加工費、副産物扱いは評価額を先に引く","ab":[],"parts":[{"h":"NRVは全量加工した姿。期末は無視、減損は売上を減損後の量、平均発生なら加工費は換算量","judge":[["追加加工工程の生産データに期首・期末仕掛品と加工進捗度がある","NRVでは使わない。分離点の量を全量完成させる加工費を引く。期首・期末は按分後の転がし計算で使う"],["「減損が平均的に発生し、正常減損率は投入量の10%である」","売上は投入量×90%。追加加工費は完成量＋減損量×50%の換算量に掛ける"]],"steps":[["分離点の量でNRVを出す","正常市価×分離点の量−正常追加加工費×分離点の量。当期の加工換算量（期末が途中の分）は使わない"],["減損があれば量を2つに分ける","売上は投入量×(1−正常減損率)、追加加工費は完成量＋減損量×50%（平均的発生）"],["NRVの比で結合原価を按分","按分後は実際データで追加加工工程を転がす。期首・期末仕掛品と実際追加加工費はここで使う"]],"why":"NRVは分離点の価値の推定。期末は翌期に完成して売れるので全量で。平均的に発生する減損は平均50%しか加工されないので換算量で引く（終点発生なら全量）","check":"","trap":["NRVの追加加工費を当期の加工換算量55に掛ける ―― 分離点の60kgを全量完成させる分で引く"],"skip":["追加加工工程の期首・期末仕掛品と進捗度はNRVに使わない ―― 1級テキストも、仕掛品の有無に関係なく按分額は同じと解説している"]},{"h":"仕損は発生点で1か0を刺してボックス。投入量に加工費を掛け、仕損品評価額を売上に足す","judge":[["「連産品Ａの追加加工工程の終点において，不可避的に仕損が発生する」","仕損は連産品A・追加原料・加工費とも1。追加加工費と追加原料費は仕損も含めた2,000個に掛ける"],["「連産品Ａの追加加工工程の始点で仕損が発生していた場合」","仕損は上から1・0・0。追加加工費と追加原料費は良品1,800個だけに掛ける"],["「連産品Ａの追加加工工程の中間点において，追加原料が投入される」","この例題は数量の比の記載が無く、生産量が増えない場合として下書きする。追加原料は中間点から終点まで一定"]],"steps":[["追加加工工程を下書きする","連産品Aは始点から長方形、追加原料は中間点から終点まで、加工費は三角形。仕損を発生点に刺す"],["ボックスで当月投入を出す","完成と仕損を右に書き、貸方合計で当月投入を出す。終点仕損なら2,000・2,000・2,000"],["NRVを出して按分する","@500×1,600＋@200×400−@20×2,000−@130×2,000＝580,000。Bは300,000。660,000をこの比で按分"],["始点仕損は1・0・0で描き直す","完成1,800、仕損200 → 投入2,000・1,800・1,800。@500×1,800＋@150×200−@150×1,800＝660,000"]],"why":"","check":"按分額の合計が結合原価660,000と一致する（終点仕損 435,000＋225,000、始点仕損 453,750＋206,250）","trap":["仕損品の評価額を足し忘れる ―― 仕損に評価額があれば売上側に足す（減損には評価額がない）","始点仕損でも追加加工費を2,000個に掛ける ―― 始点の仕損は加工も追加原料も受けない"],"skip":["実際売却価格@510・仕損の実際発生量500個は按分に使わない ―― 実際データは最終完成品原価と売上総利益で使う"]},{"h":"副産物扱いの連産品は評価額を結合原価から先に引き、残りを他の連産品のNRVで按分","judge":[["「連産品Ｃの価額については，副産物に準じて計算する」","Cは評価額＝(見積売却価格−追加加工費−販管費)×数量。結合原価から先に控除し、A・Bだけで按分"],["「連産品Ｃを他の連産品と同様に取り扱う場合」","CもNRV（見積売却価格−追加加工費）を出し、A・B・Cの3つで按分"]],"steps":[["Cの評価額を出す","(@100−@50−@10)×500kg＝20,000。副産物は原価を推定するので販管費も引く"],["結合原価から先に引く","210,000−20,000＝190,000。いきなりA・B・Cの3つで割らない"],["A・BのNRVで按分する","A (@500−@300)×2,000kg＝400,000、B (@300−@200)×1,000kg＝100,000 → A 152,000・B 38,000"]],"why":"副産物は原価を計算せず評価額を主産物から控除するだけ（基準28）。基準 ]}]},"shorts":[{"hl":"借方は/[標準]か[実際]か","at":null}]},{"id":"k13-2","no":"13-2","title":"差異分析と標準原価計算の理論","sub":"工原","ch":13,"probs":["工原13-1","工原13-2","工原13-3","工原13-4"],"w":1.023,"wt":["標準操業度を「基準操業度 ÷ 基準生産量」から作る","総差異での検算をしない（切り方が違っても合計は同じ）"],"hl":"[3分法]の/分かれ目","acct":"工原","core":{"t":"製造間接費の差異は4分法が基本。3分法は固定費の能率部分を能率差異に入れる（Ⅰ）か操業度差異に入れる（Ⅱ）かの違いで、合計は変わらない","ab":[["インプット法","投入の都度つかむ。理由も分かるが煩雑。シングル・プランが通常。個別原価計算が前提（例外はロット別生産）"],["アウトプット法","生産量の確定時点にまとめて。楽だが理由も責任者も分からない。パーシャルと結びつきやすい。例外管理に即す"]],"parts":[{"h":null,"judge":[["「三分法」「能率差異は標準配賦率により算定」","3分法のⅠ。能率差異＝標準配賦率×（SH－AH）、操業度差異＝固定費率×（AH－NH）。遊休時間が正確に出る（設備管理）"],["「能率差異を変動費率から算定」","3分法のⅡ。能率差異＝変動費率×（SH－AH）、操業度差異＝固定費率×（SH－NH）。能率差異が正確（原価管理）"],["実査法で「標準時間と実際時間の予算許容額の差額」","Ⅱの形。能率差異は予算線の上の2点（SHとAHの予算許容額）の差。「標準配賦額の差額」ならⅠの形"],["「固定予算額」と標準配賦率だけで、変動費率が無い","固定予算。予算差異＝固定予算額－実際。能率差異・操業度差異は標準配賦率1本で（SH－AH）（AH－NH）"]],"steps":[["率とNHを月でそろえる","変動費率・固定費率・基準操業度を出す。年間の予算・基準操業度なら12で割る"],["SHを当月投入の換算量から","完成－月初の換算量＋月末の換算量に1個あたり標準時間を掛ける。時間が無ければ基準操業度÷基準生産量"],["総差異と予算差異を出す","総差異＝標準配賦率×SH－実際。予算差異＝固定費予算＋変動費率×AH－実際（どの分法でも同じ）"],["能率と操業度を指示どおりに","4分法（変動費能率・固定費能率）を基本に、Ⅰ・Ⅱ・2分法（管理可能差異＝予算＋変動費能率）へまとめる"]],"why":"能率を上げて減るのは変動費だけ（Ⅱの言い分）。AHとNHの差は遊休時間そのもの（Ⅰの言い分）。どちらに寄せても差異の合計は同じ","check":"どの分法でも、差異の合計が総差異（標準配賦率×SH－実際発生額）と一致する","trap":["Ⅱで操業度差異をAHとNHの差で取る ―― Ⅱの操業度差異はSHとNHの差（固定費の能率部分を含む）","SHを完成品数量から作る ―― 当月投入の換算量に1個あたり標準時間を掛ける","差異を切った後、総差異と突き合わせずに進む ―― 合わなければ率か切り方が違う"],"skip":["実査法変動予算はＣランク。3分法のⅠ・Ⅱの形が分かれば、折れ線の上で同じ切り方をするだけ"]}]}},{"id":"k13-3","no":"13-3","title":"仕損の第1法と第2法","sub":"工原","ch":13,"probs":["工原13-10"],"w":0.744,"wt":["仕損の第1法（消費余裕を含む）の読み方"],"hl":"仕損は[第1法]か/[第2法]か","acct":"工原","core":{"t":"仕損の余裕は片方にだけ入れる。カードの数量に入れたらボックスから仕損を消す（第1法）、カードに1行立てたら仕損を残す（第2法）","ab":[["第1法","余裕はkg・時間の中。ボックスは仕損を消す（度外視法と整合的）"],["第2法","正常仕損費を独立の行に。ボックスは仕損を残す（非度外視法と整合的）"]],"parts":[{"h":null,"judge":[["標準消費量・標準直接作業時間に「（仕損等の消費余裕を含む）」","第1法。数字はもう余裕込みなので、そのままカードに使う。ボックスから仕損を消して個数を取る"],["「仕損の余裕分は、製品の標準消費量や標準作業時間に含ませる方法」「度外視法と整合的」","第1法。余裕抜きの数量と発生率が別に書いてあれば、数量に率を乗せてカードを作り替える"],["「独立の項目とする方法 下に割る方法。指示が無ければ通常の方法（左右）で解く"],["「減損は始点で発生する」","発生点を通過した量を右から数え直す（完成品＋期末－期首）。変わるのは一番内だけで、配合差異は終点発生と同じ"]],"steps":[["外と真ん中を置く","一番外は実際消費量（実際の配合）そのまま。真ん中は合計を動かさず、標準配合割合で割り直す"],["標準減損を完成品から出す","減損発生点を通過した量を右から数え、標準の「減損÷残る量」を掛ける。投入量には掛けない"],["標準投入量で一番内を作る","実際減損と標準減損の差だけ実際投入量から減らす。それを標準配合割合で按分する"],["中から外を引いて2つの差異","（真ん中－外）×SPが配合差異、（内－真ん中）×SPが歩留差異。向きはいつも通り中から外"],["加重平均の指示なら上下に割る","配合差異は（SP－WASP）×（SQ－AQ）で縦軸だけ外から中。歩留差異はWASP×（SQ－AQ）"]],"why":"配合割合がずれると総量（歩留）も連動してずれる。総量は実際のまま割合だけ標準に戻した列を挟めば、2つのずれを分けられる","check":"配合差異の合計と歩留差異の合計は、通常の方法でも加重平均でも同じ","trap":["標準減損を投入量（期首＋当期投入）に掛けて出す ―― 異常な投入が混ざるので標準にならない","加重平均で真ん中の列（実際消費量・標準配合）を使う ―― 使うのは一番内と一番外","加重平均で縦軸も中から外（WASP－SP）で引く ―― 配合差異の符号が逆になる"],"skip":["配合差異も歩留差異も有利（または両方不利）になっても誤りとは限らない ―― トレード・オフは「なりやすい」で、作問しだい","算定する3条件（価格の違う2種類以上・部分的な代替可能性・測定単位が同一）は理論で問われたときに言う。計算の手順は変わらない"]}]}},{"id":"k13-7","no":"13-7","title":"構成差異と能率差異","sub":"工原","ch":13,"probs":[],"w":0.049,"wt":[],"hl":"労務費を/[2つ]に割る","acct":"工原","core":{"t":"配合差異・歩留差異の労務費版。実際時間を標準構成で割り直した列を挟み、外との差が構成差異、標準時間との差が能率差異","ab":[["通常の方法（指示なし）","左右に割る。標準時間・標準構成／実際時間・標準構成／実際時間・実際構成の3列。単価は各工員の標準賃率"],["加重平均標準賃率","上下に割る。WASPの横線の上が構成差異、下が能率差異。真ん中の列は使わない"]],"parts":[{"h":null,"judge":[["賃率の違う工員グループが組み、「時間差異を能率差異と構成差異とに区分」","列を3本にする合図。実際の合計時間を標準構成で割り直した列を真ん中に置く"],["「10kgを加工するのに要する標準作業時間の合計は2時間」","一番内のSHの出し方。加工換算量（生産データの貸借差額）を10kgで割って2時間を掛ける"],["「加重平均標準価格を用いる」","上下に割る方法。縦軸だけ外から中（各工員の標準賃率－WASP）を引く"]],"steps":[["一番外に実際時間を置く","工員グループごとの実際作業時間をそのまま置き、合計を出す"],["標準時間を加工換算量から出す","当期の加工換算量を生産データの貸借差額で取り、標準能率で時間に直す。当期投入の重さは使わない"],["内と真ん中を標準構成で割る","標準時間と実際の合計時間を、それぞれ標準構成（関与の割合）で割る"],["中から外を引いて2つの差異","（内－真ん中）×標準賃率が能率差異、（真ん中－外）×標準賃率が構成差異。賃率差異はいつも通り"],["加重平均の指示なら上下に割る","構成差異は（標準賃率－WASP）×（SH－AH）。能率差異はWASP×（SH－AH）"]],"why":"賃率は一企業ではどうしようもないが、時間は管理できる。だから時間差異を、関与の割合のずれ（構成）と時間そのもののずれ（能率）に割る","check":"構成差異の合計と能率差異の合計は、通常の方法でも加重平均でも同じ","trap":["真ん中の列を実際の構成で割る ―― 一番外と同じ数字になり、構成差異が出ない","当期投入の重さをそのまま時間に直す ―― 時間に使うのは加工換算量","加重平均で縦軸も中から外で引く ―― 構成差異の符号が逆になる"],"skip":["問題集にこの形の問題は無い（材料の配合差異・歩留差異が対応する形）","テキストの「労働能率差異」「人員構成差異」は呼び名の違いで、中身は同じ"]}]}},{"id":"k13-8","no":"13-8","title":"労務費の歩留差異と能率差異","sub":"工原","ch":13,"probs":["工原13-12"],"w":0.049,"wt":[],"hl":"労務費の/[歩留差異]","acct":"工原","core":{"t":"作業時間差異を、減損が多くて余分に加工した分（歩留差異）と純粋な能率の悪さ（能率差異）に割る。標準減損は産出から、時間は投入から出す","ab":[],"parts":[{"h":null,"judge":[["「直接作業時間は材料の投入量に比例して増加する」「加工費は材料投入量に比例して発生する」","作業時間差異から歩留差異を分けてよい条件。比例しないなら歩留差異は出せず、能率差異として一括"],["「原料Ｘ５㎏を必要とするが…製品βの重量は４㎏」のように投入量と産出量が違う","標準減損は通過した量に（減損÷産出量）を掛ける。時間は投入量あたりで換算する。割る相手が2つある"],["「減損が工程の始点で発生」「終点で発生」","減損の加工換算量は発生点の進捗度を掛けた量。始点なら0なので標準と実際の加工量が同じになり、労務費・製造間接費の歩留差異は出ない"],["「その他の作業時間差異」「その他の能率差異」","歩留差異を除いた残りの能率差異（S'H－AH）"],["「能率差異は標準配賦率から算定する」","製造間接費の歩留差異と能率差異に標準配賦率を掛ける。操業度差異は固定費率"]],"steps":[["一番外に実際時間AH","資料の実際作業時間をそのまま置く"],["S'Hを実際の加工量から出す","実際のボックスの貸借差額で実際の加工換算量を出し、投入量あたりの標準時間で時間に直す"],["標準減損を産出から出す","減損発生点を当期に通過した量を完成品から戻って数え、（減損÷産出量）を掛ける"],["SHを標準の加工量から出す","実際減損との差だけ投入を減らした標準のボックスを作る。貸借差額の標準加工量を投入量あたりの時間で直す"],["中から外を引いて2つの差異","（SH－S'H）×標準賃率が歩留差異、（S'H－AH）×標準賃率が能率差異。製造間接費は同じ横軸に基準操業度を足す"]],"why":"減損が多いと、余分に投入した分まで加工するので時間がかかる。その時間は作業の能率の悪さではないので、歩留差異として分ける","check":"","trap":["標準減損を投入量で割って出す、SH・S'Hを産出量で割って出す ―― 標準減損は産出ベース、時間は投入ベース","期首仕掛品が発生点を前期に通過しているのに、通過した量から引き忘れる ―― 標準減損が過大になる","当期投入の重さをそのまま加工量に使う ―― 使うのは貸借差額の加工換算量"],"skip":["3つに割って加重平均を使うときの歩留差異・能率差異の内訳は意味が薄いと言われ、出題可能性も低い（合計は同じ）","歩留差異は購買部門、能率差異は製造部門の責任という読み方は論述用。計算には効かない"]}]}},{"id":"k13-9","no":"13-9","title":"工程別の標準原価計算","sub":"工原","ch":13,"probs":["工原13-14","工原13-15"],"w":0.049,"wt":[],"hl":"[工程別]も/標準で","acct":"工原","core":{"t":"1枚のカードを工程（作業）ごとに切り分け、工程ごとの個数に掛けるだけ。前工程費と始点の材料は実在量、加工費は換算量に掛ける","ab":[["作業点別（作業区分）","同じ工程の中の作業の違い。材料と製造間接費は工程全体のボックス、労務費は作業ごと。勘定もシュラッター図も1つ"],["工程別（累加法）","工程が違う。第一工程完了品原価を前工程費として第二工程へ転がす。勘定もシュラッター図も工程ごとに2つ"]],"parts":[{"h":null,"judge":[["「作業工程を２つの作業区分に分け、直接労務費については作業区分ごとの管理」","作業点別。ボックスを3つ描く（工程全体・第１作業・第２作業）。製造間接費のSHは作業ごとのSHの合計"],["月初「（第１作業の１/２）」・月末「（第２作業の１/３）」","作業ごとに換算量を取り直す。第１作業の月末と第２作業の月初は立たない。工程全体の進捗度は済んだ時間÷合計時間"],["「累加法による工程別標準原価計算」「第一工程完了品の原価標準」","カードを工程で切り、第一工程を先に解き切る。完了品原価を第二工程の借方に前工程費として入れる"],["パーシャル・プランで「製造間接費については実際発生額を記入すること」","借方は材料・労務費・製造間接費とも実際発生額。貸借差額が原価差異"]],"steps":[["カードを工程・作業で切る","始点で入る材料とその工程の加工費を1枚に。前の工程の完了品原価は、次の工程の始点に前工程費として置く"],["工程・作業ごとにボックスを描く","月初・月末がどこにいるかで実在量と換算量を置く。通過し終えた工程（作業）では完了品の側に入る"],["個数×原価標準で勘定を埋める","前工程費と始点の材料は実在量、加工費は換算量に掛ける。借方に実際発生額を入れ、貸借差額が原価差異"],["SQ・SHは各工程の当月投入から","材料はその材料を入れる工程の当月投入（実在量）、労務費はその工程（作業）の当月投入換算量に標準の量を掛ける"],["製造間接費の横軸を作る","労務費のSH・AHをそのまま使い、一番外に基準操業度。作業点別は作業ごとを足して1つ、工程別は工程ごとに2つ"]],"why":"標準原価計算は個数に原価標準を掛けるだけ。カードを切り分ければ、前の工程の実際の計算を待たずに各工程を計算できる","check":"作業点別は、工程全体の当月投入換算量×合計時間が、作業ごとのSHの合計と一致する","trap":["「製造間接費については実際発生額を記入」を、製造間接費だけ実際・他は標準と読む ―― パーシャル・プランは材料・労務費も借方が実際","作業の進捗度（第１作業の１/２）を工程全体の進捗度にも使う ―― 工程全体は時間の割合で取り直す","第二工程の月初・月末で前工程費に進捗度を掛ける ―― 前工程費は始点投入の材料と同じ扱い"],"skip":["第二工程の原価差異に前工程費の分は入らない ―― 前工程費は標準原価で受け入れるから","標準原価計算の非累加法は出題可能性が低い。累加法と足し合わせた結果は一致する（どちらも個数×原価標準）"]}]}},{"id":"k13-10","no":"13-10","title":"生産量がキログラム","sub":"工原","ch":13,"probs":["工原13-11"],"w":0.049,"wt":[],"hl":"単位が/[kg]のとき","acct":"工原","core":{"t":"原価カードの右下を「投入量あたり」「完成量あたり」の2行にする。減損を負担させる所は完成量で、負担させない所は投入量で割る","ab":[],"parts":[{"h":null,"judge":[["生産データの単位が個数ではなく「㎏」","カードの右下を2行にする合図。投入量あたりと完成量あたりは同じ原価で、同義"],["「製品σ１個の製造には原料Ｘ10㎏の投入…製品σ１個の重量は８㎏」","カードは投入量で作る。減損の発生点（始点・途中・終点）でカードは変わらない。効くのは仕掛品に掛けるときの割る数"],["「減損は工程の終点で発生する」","完成品は完成量で割って減損を負担させる。終点に届いていない期首・期末は投入量で割る"],["減損の発生地点がどこにも書いていない","第1法に依るしかない。完成品も月初も月末も完成量で割り、SHも完成量で割る"]],"steps":[["カードの右下を2行にする","縦に足した原価標準を「投入量あたり」「完成量あたり」の2行で書く"],["完成品と仕掛品に掛ける","減損を負担させる所は完成量で割って単価を上げる。負担させない所は投入量で割る"],["SQは標準減損から出す","完成品から標準減損を出し、標準のボックスの貸借差額を当期投入のSQにする"],["SHとS'Hはボックスを2つ書く","標準減損のボックスの加工換算量からSH、実際減損のボックスからS'H。どちらも投入量あたりの時間で直す"]],"why":"同じ原価を少ない完成量で割れば1kgあたりの単価が上がる。その上がった分が減損の負担になる","check":"","trap":["完成品まで投入量で割る ―― 減損の負担が乗らない","終点発生なのに期首・期末も完成量で割る ―― 終点に届いていない仕掛品に減損を負担させてしまう","標準のボックスに実際の減損を入れる ―― SQが実際の投入量と同じになり、数量差異が消える"],"skip":["テキストのように1kgあたりのカードに直さなくてよい。右下の2行で足りる","発生地点が不明な形のS'Hの出し方は出題可能性が低い"]}]}},{"id":"k13-11","no":"13-11","title":"仕損と減損が両方出る","sub":"工原","ch":13,"probs":[],"w":0.049,"wt":[],"hl":"仕損と減損が/[同時]に","acct":"工原","core":{"t":"SQ（仕損も減損も標準）とAQの間に、仕損だけ実際にしたS'Qを挟む。SQとの差が仕損差異、AQとの差が減損差異","ab":[],"parts":[{"h":null,"judge":[["「減損が生じ、さらに良品に対して10%の仕損が生じた結果、良品の正味重量は9kgとなる」","1個あたりの図を描く。正味＋正常仕損（0.1個×正味）＋正常減損（1.1個×1個の減損）が外枠の標準投入量"],["「当期の仕損は60個」「仕損品 250個」のように実際の仕損が個数で出る","S'Qの位置を決める数。正常仕損との差（超過の個数）に1個あたりの投入量を掛けて、SQに足す"],["「減損は工程の始点で、仕損は工程の終点で発生する」","個数をkgに直すとき、減損の前にいる物は投入量、減損の後にいる物は正味の重さを掛ける。時間も加工する重さで割る"],["「正常仕損を超えて発生した仕損は、異常仕損費として一括把握する」","異常仕損費＝超過の個数×正常仕損費を含まない単価。終点発生なら完成品は正常仕損費を含む単価"]],"steps":[["1個あたりの図を描く","正味・正常仕損・正常減損を積み上げて、外枠（1個あたりの標準投入量）を出す"],["SQを出す","仕掛品が無ければ図を完成品数倍。あれば個数をkgに直したボックスを3つ書き（標準仕損×標準減損・実際仕損×標準減損・実際）、当期投入を取る"],["S'Qで区切る","仕損だけ実際にした投入量。SQに超過仕損の投入量を足した量で、AQとの残りが蒸発しすぎの分"],["中から外を引いて差異","（SQ－S'Q）×SPが仕損差異、（S'Q－AQ）×SPが減損差異。価格差異はAQに掛ける"],["時間に落とす","SQ・S'Q・AQを加工する重さで時間に直してSH・S'H・A'H。一番外が実際時間AH。製造間接費も同じ横軸"]],"why":"投入が標準より多い原因は、こぼしすぎ（異常仕損）と蒸発しすぎ（異常減損）の2つ。仕損だけ実際にした点で区切れば2つに分かれる","check":"","trap":["超過仕損を正味の重さで数える ―― 焦がした1個が蒸発する分まで余計に投入している","正常減損を1個分の減損のままにする ―― こぼす0.1個からも蒸発しているので1.1個分","標準仕損×標準減損のボックスに実際の仕損を置く ―― SQがS'Qと同じになり仕損差異が消える"],"skip":["S'Qで区切るのは多数説で、理論的な必然性は無い。指示が無ければここで区切る","差異の名前は問題で変わる（仕損差異・減損差異・時間差異／異常仕損費・歩留差異・労働能率差異）。中身は同じ"]}]}},{"id":"k14-1","no":"14-1","title":"直接原価計算の基礎と固定費調整","sub":"工原","ch":14,"probs":["工原14-1","工原14-2"],"w":0.848,"wt":["全部原価計算で、どの固定費を1個あたりにするか"],"hl":"","acct":"工原","core":{"t":"全部と直接で違うのは固定製造原価だけ。全部は販売分だけ、直接は発生額を全額費用にする。利益の差は期末と期首の固定製造原価の差","ab":[["全部原価計算（外部公表用）","固定製造原価も製品原価。1個あたりにして転がし、販売分はP/L、期末分はB/S"],["直接原価計算（内部用）","固定製造原価は期間原価で、発生額を全額P/L。変動費だけ上に抜いて貢献利益を出す"]],"parts":[{"h":null,"judge":[["固定の製造間接費に「予定配賦率：300円/個、基準操業度1,000個」","固定費のうち1個あたりにするのは固定製造原価だけ。基準操業度は予定配賦率のための数。固定の販売費及び一般管理費はどちらの計算でも期間の総額"],["「原価差異（操業度差異）は売上原価に賦課する」","全部原価計算で、予定配賦額と固定費の発生額との差を売上原価に足し引きする。直接原価計算は発生額をそのまま載せる"],["「ころがし調整法」／「変動加工費を配賦基準とする一括調整法」","ころがしは先入先出法で転がした期首・期末の固定費。一括は当期投入の固定加工費÷変動加工費の率を、期末の変動加工費に掛ける"],["「販売量よりも生産量が大きい場合、全部原価計算の営業利益は…大きい」","○。期末が期首より増えるので、期末の固定製造原価＞期首。全直末首の右辺が正なら左辺も正"]],"steps":[["コストを5つに仕分ける","製造原価（材料費・変動加工費・固定加工費）と販管費（変動・固定）に分ける。製品に載るかで先に分ける"],["製造原価だけ転がす","全部は3つとも、直接は固定加工費を除いて仕掛品・製品のボックスで転がす。販管費はボックスに入れない"],["2つのP/Lを作る","直接は変動売上原価と変動販売費を上に抜いて貢献利益。固定費（製造原価は発生額）と販管費の固定費を下にまとめる"],["固定費調整で全部に直す","直接原価計算の営業利益＋期末棚卸資産の固定製造原価－期首棚卸資産の固定製造原価"]],"why":"固定製造原価を、全部は製品に載せて在庫に残し、直接は発生した期に全額費用にする。在庫に残った分だけ利益がずれる","check":"全部原価計算の営業利益－直接原価計算の営業利益＝期末棚資の固定製原－期首棚資の固定製原（全直末首）","trap":["固定の販売費・一般管理費まで基準操業度で割って1個あたりにする ―― 販管費はどちらの計算でも期間の総額","全部原価計算なのに固定製造間接費を1個あたりにせず、全額を売上原価に流す ―― それは直接原価計算の答え","販管費を仕掛品・製品のボックスに入れて転がす ―― 販管費は製品に載らない"],"skip":["一括調整法の営業利益が全部原価計算とわずかにずれても誤りではない ―― 一致するのはころがし調整法","一括調整法の簡便法（分母をすべてのアウトプットの変動加工費にする形）は出題可能性が低い"]}]}},{"id":"k14-2","no":"14-2","title":"標準直接原価計算と固定費調整","sub":"工原","ch":14,"probs":["工原14-3"],"w":0.0,"wt":[],"hl":"","acct":"工原","core":{"t":"標準なら固定費調整は、1個あたりの固定製造原価×（期末の数－期首の数）。直接原価計算には固定費から出る差異が無い","ab":[],"parts":[{"h":null,"judge":[["固定加工費の予算額と「全部原価計算を用いる場合の基準操業度は1,040ｈ」","固定費のうち1個あたりにするのは固定製造原価だけ。予算÷基準操業度×1個あたりの時間。直接原価計算では使わない"],["「年間予算固定販売費」「販売費（固定費）」","販売費及び一般管理費の固定費は、どちらの計算でも期間の総額（実際額）をP/Lに載せる。割らない"],["「原価差異は売上原価に賦課」「差異は正常かつ比較的少額」","差異は全額売上原価へ。全部は4か所（材料・労務費・シュラッター図の上下）、直接は変動費の3か所だけ"],["「差異は原価要素別に完成品換算量を基準に追加配賦」","多額の扱い。売上原価・期末製品・期末仕掛品に配り、固定費調整の期末に、期末へ配った固定費の差異を足す"],["「原価標準はここ数年変更されていない」","期首在庫も同じ単価。期首・期末とも1個あたりの固定製造原価×数で固定費調整ができる"]],"steps":[["カードをVとFに分ける","変動費の合計と、1個あたりの固定製造原価（予算÷基準操業度×1個あたりの時間）を分けておく"],["全部原価計算のP/L","売上原価＝（V＋F）×販売量。差異は4か所の合計。販売費は変動・固定とも問題文の額"],["直接原価計算のP/L","変動売上原価＝V×販売量、差異は変動費の3か所だけ。固定費は製造原価も販売費も発生額を下にまとめる"],["固定費調整","期末・期首の仕掛品は換算量、製品は個数に1個あたりの固定製造原価を掛ける。直接の営業利益＋期末－期首"]],"why":"直接原価計算は固定製造間接費を単価にせず発生額で載せるので、シュラッター図の下半分が無い。固定費の差異は両方の計算に同額入っていて、差を取ると消える","check":"全部の営業利益－直接の営業利益＝1個あたりの固定製造原価×（期末の数－期首の数）（差異が少額のとき）","trap":["固定の販売費まで基準操業度で割って1個あたりにする ―― 1個あたりにする固定費は固定製造原価だけ","直接原価計算のP/Lに固定費から出た差異（操業度差異など）を乗せる ―― 固定費は発生額で載っている","期末仕掛品の固定費を個数に掛ける ―― 加工費なので換算量に掛ける"],"skip":["差異が多額でも、期首に差異を足すのは前期に追加配賦があったときだけ","変動販売費にも標準を設定する形は、その差異を販売量から出すだけ。貢献利益・営業利益は変わらない"]}]}},{"id":"k14-3","no":"14-3","title":"直接原価計算の長所短所とセグメント別損益計算","sub":"工原","ch":14,"probs":["工原14-4"],"w":0.0,"wt":[],"hl":"","acct":"工原","core":{"t":"固定費を個別固定費と共通固定費に割り、間のセグメント・マージンで事業を評価する。弱みは変動費と固定費の区分の恣意性で、外部公表に使えない","ab":[["全部原価計算方式（純益法）","共通固定費も売上高で配って各事業の営業利益まで出す。関係のない固定費が入り、事業の収益性が見えない"],["直接原価計算方式（総益法）","変動費→個別固定費→共通固定費の順に引く。個別固定費を引いた段がセグメント・マージン"]],"parts":[{"h":null,"judge":[["「各製品別の損益計算書（直接原価計算方式）」、固定費が「個別固定費」「共通固定費」","変動費を引いた段の下を2段に割る。個別固定費を引いてセグメント・マージン、共通固定費を引いて営業利益"],["解答欄が「限界利益」→「個別固定費」→「貢献利益」の並び","問題集はセグメント・マージンを「貢献利益」と呼ぶ。講義の貢献利益とは1段ずれるので、欄の位置で見分ける"],["「共通固定費は売上高基準で両製品に配賦する」","各製品の売上高を先に出し、その比で製造原価と販管費の共通固定費をそれぞれ配る。配る指示が無く合計の欄だけなら全社で引く"],["「販売量が一定のまま生産量だけ増やす」と営業利益はどうなるか","全部は固定製造原価だけを1個あたりにするので単価が下がり利益が増える（販管費は期間の総額）。直接は発生額を全額費用にするので変わらない"]],"steps":[["変動費まで引く","売上高（価格×数量）から変動売上原価、変動販売費を引いて貢献利益（問題集では限界利益）"],["個別固定費を引く","その事業に直接ひも付く固定費（製造と販売の合計）を引いてセグメント・マージン"],["共通固定費を引く","本社の社長給料や本社建物の減価償却費のような共通固定費を引いて営業利益"],["続けるかはセグメント・マージンで","営業利益が赤字でも、セグメント・マージンが黒字なら撤退しない"],["長所を問われたら","追加注文は変動費以上なら受けられる（固定費は埋没原価）。変動費は標準で、固定費は総額で管理できる"],["短所を問われたら","変動費と固定費の区分に恣意性が入り、区分がずれると利益まで変わる。だから外部公表には使えない"]],"why":"共通固定費は売上高などで無理やり配られただけで、その事業のコストではない。事業の業績は、事業にひも付く費用だけを引いた段で見る","check":"期首・期末の在庫が無ければ、全部原価計算方式と直接原価計算方式の営業利益は一致する","trap":["共通固定費まで入った営業利益の赤字で撤退と判断する ―― セグメント・マージンが黒字なら撤退しない","問題集の「貢献利益」を講義の貢献利益と同じ段と思う ―― 問題集では個別固定費を引いた後の段","共通固定費を製品数や販売数量の比で配る ―― 指示は売上高基準"],"skip":["個別固定費を管理可能・管理不能に割る形は事業部制で使う。ここはまとめて個別固定費でよい","直接原価計算論争（期間利益は売上高に対応すべきか）は短C・論C"]}]}},{"id":"q15-1","no":"15-1","title":"管理会計の基礎 責任会計と計画・統制","sub":"工原","ch":15,"probs":[],"w":0.0,"wt":[],"hl":"","acct":"工原","core":{"t":"理論だけ。管理会計は内部向け・定量情報・要件は有用性。責任会計は管理可能性で評価。統制は事前・期中・事後、主たる貢献はミドルのMC","ab":[],"parts":[{"h":"管理会計は内部向けで過去＋未来、定量情報だけ、法規制は概念上なし、要件は有用性のみ","judge":[["管理会計情報が具備すべき唯一の要件","有用性（目的適合性）。中身は経営管理者の情報ニーズに依存する"],["管理会計は社会的法規制の影響を受けない","概念上は一切受けない。現実は財務会計と不可分なので、間接的に影響を受ける"],["管理会計のアウトプット情報に定性情報を含む","×。会計である以上すべて定量情報。非財務情報も定量情報の一部"]],"steps":[["利用者で分ける","財務会計＝外部利害関係者（外部報告会計）、管理会計＝内部経営管理者（内部報告会計）"],["情報の時点で分ける","財務会計＝過去情報、管理会計＝過去情報＋未来情報（予算）"],["情報の種類で分ける","財務会計＝財務情報、管理会計＝財務情報と非財務情報。どちらも数値化できる定量情報"],["法規制と要求される性質を言う","財務会計＝会社法・金融商品取引法・税法の規制、正確性・公平性・検証可能性。管理会計＝概念上は規制なし、有用性"]],"why":"","check":"","trap":["減損・貸倒引当金は将来を見積もるので財務会計も未来情報 ―― 正しくは現時点の見積りで、予算のような未来情報ではない","非財務情報は定性情報 ―― 正しくはkg・人・時間など数値化できる定量情報"],"skip":[]},{"h":"責任センターで区切り、管理可能性に基づいて評価する。センターは権限の広さで4つ","judge":[["売上に責任のない工場長を売上の減少で評価する","責任会計に反する。管理不能な部分の評価になる（管理可能性原則）"],["投資権限のある事業部","投資（インベストメント）センター。利益と投資額に責任を負う"]],"steps":[["定義の2語を押さえる","責任センターごとに、管理者の予算目標と実績を管理可能性に基づいて集計するシステム"],["範囲の広さで4つに並べる","原価（コスト）→収益（会計士は売上高と販売費、1級は収益のみ）→利益（売上高－原価）→投資（利益と投資額）"],["管理可能な範囲で評価する","権限と責任の範囲を一致させる。相対的に影響を及ぼせれば管理可能とみなす"]],"why":"管理者の業績を明確に測って動機づけるため。権限の外のことで評価すると、不満感・不公平感で動機づけを損なう","check":"","trap":["管理可能＝完全に影響を及ぼせること ―― 正しくは他の管理者と比べて相対的に影響を及ぼせれば管理可能"],"skip":[]},{"h":"個別計画は統制から独立、期間計画は統制の出発点。統制は事前・期中・事後で今は前2つも重視","judge":[["現代の統制活動はもっぱら事後統制として行われる","×。環境変化が激しく、事前統制と期中統制が重視される"],["個別計画と期間計画を包括する管理会計を業績管理会計とする","×。業績管理会計は期間計画と統制を包括する。個別計画は意思決定会計"]],"steps":[["区切り方で計画を分ける","プロジェクトで区切る＝個別計画（随時的）、期間で区切る＝期間計画（経常的・年次予算とほぼ同義）"],["個別計画を2つに分ける","構造の変革を伴う＝戦略的意思決定（設備投資）、構造を所与とした日常業務＝戦術的意思決定"],["統制を3つに分ける","事前＝動機づけ、期中＝逸脱の制御、事後＝差異分析と是正措置。PDSのP・D・Sに当たる"],["体系を2つに分ける","個別計画＝意思決定会計。期間計画と3つの統制＝業績管理会計"]],"why":"","check":"","trap":["戦術的意思決定も上級管理者が決める ―― 正しくは中級ないし下級管理者（1級テキストの表）"],"skip":["旧体系を2つと3つ、新体系を1つと4つで分ける数え方 ―― 講師が細かすぎると明言。1級工原テキスト・問題集に計画会計・統制会計の語は0件"]},{"h":"トップ＝戦略策定、ミドル＝MC、ロワー＝TC。管理会計の主たる貢献は計画と統制を担うMC","judge":[["管理会計の主たる貢献","マネジメント・コントロール。計画と統制の相互作用を要するため。ただし全プロセスに貢献する"],["MCとTCの決定的な相違","コントロール対象。MC＝人間が行う意思決定、TC＝物理的な生産プロセス（作業）"],["マネジメント・コントロールが必要になる理由","分権化で権限を委譲された管理者の意思決定に、目標整合性を持たせるため"]],"steps":[["3つを経営階層に当てる","戦略策定＝トップ（ほとんど計画）、MC＝ミドル（計画および統制）、TC＝ロワー（ほとんど統制）"],["MCとTCを対象と技法で分ける","MC＝人間・動機づけ等の行動的な技法、TC＝作業・物量情報を主体とする管理工学的な技法"],["MCの必要性を順に言う","規模拡大・環境の複雑化→権限委譲（分権化）→全社的に望ましくない意思決定のおそれ→目標整合性の確保"],["責任会計とつなぐ","MCは業績評価を通じて管理者の意思決定に影響を与えるので、責任会計制度に基礎をおく"]],"why":"","check":"","trap":["管理会計はMCのプロセスにだけ貢献する ―― 正しくは経営管理のプロセスすべてに貢献し、主たる貢献がMC"],"skip":["MCとTCの境目をPDSのどこに引くか ―― 講師 "ch":21,"probs":["工原21-1","工原19-8"],"w":0.467,"wt":["ROI・RI は分母（投下資本）にも「管理可能」が掛かる"],"hl":"","acct":"工原","core":{"t":"事業部長は管理可能で分子も分母も絞りRIで、事業部自体は追跡可能で総額のままROIで見る。RIは部分最適化を防ぎ、ROIは比べやすい","ab":[["事業部長（RIが望ましい）","管理可能営業利益と管理可能投下資本。ROIだと資本コストを超える投資でも薄まって棄却される"],["事業部自体（ROIが望ましい）","事業部営業利益と総投下資本。%なので投資規模の違う事業部や他企業と比べられる"]],"parts":[{"h":null,"judge":[["投下資本の「このうち…％は各事業部長にとって管理可能」","事業部長の評価は分母も管理可能投下資本に絞る。事業部自体なら総投下資本のまま"],["「管理可能投下資本利益率（ＲＯＩ）」「管理可能残余利益（ＲＩ）」","事業部長の評価。分子は管理可能営業利益、分母は管理可能投下資本。RI＝利益−投資額×資本コスト率"],["「事業部自体の業績評価指標としての」ROI及びRI","事業部営業利益と総投下資本。本社費・共通費配賦後の事業部利益を使うのは指示があるとき"],["新規投資の利益率は資本コストを上回るが、投資後に事業部長のROIが下がる","ROIで評価すると棄却（部分最適化）。RIなら新規投資のRIがプラスなので採用（全社最適化）"]],"steps":[["誰の評価かを読む","事業部長なら管理可能性、事業部自体なら追跡可能性。使う利益と投資額を両方とも替える"],["利益を拾う","事業部長は管理可能営業利益、事業部自体は事業部営業利益（指示があれば事業部利益）"],["投資額を拾う","事業部長は総投下資本から管理不能分を除いた管理可能投下資本、事業部自体は総投下資本"],["ROIとRIを出す","ROI＝利益÷投資額（%）。RI＝利益−投資額×資本コスト率（円）"],["望ましい指標を言う","事業部長はRI（部分最適化を防ぐ）。事業部自体はROI（投資規模の違う相手と比べられる）"]],"why":"%は薄まる。20%の食塩水に12.5%を混ぜると下がるが、RIは利益率がハードルレートを超えていれば必ず増える","check":"各事業部の利益を足すと、全社の合計欄と一致する","trap":["分子だけ管理可能にして、分母は総投下資本のまま割る ―― 分母にも「管理可能」が掛かる","指標が変われば利益も変わると思い込む ―― ROIでもRIでも、誰の評価かで決まった利益は動かさない","正しく出した数字を「おかしい」と思って消す ―― 消す前に事業部の合計が全社と合うかで確かめる"],"skip":["事業部自体にRI、事業部長にROIという逆の見解は補足（1級の範囲外の印）。本筋は事業部長RI・事業部自体ROI"]}]}},{"id":"k21-4","no":"21-4","title":"内部振替価格 原価基準の5つ","sub":"工原","ch":21,"probs":[],"w":0.0,"wt":[],"hl":"","acct":"工原","core":{"t":"振替価格にXの固定費が入ると目標整合性×、工場の利益が仕組みとしてゼロなら業績測定×。目標整合性はYの貢献利益、業績測定はXの利益で見る","ab":[["目標整合性","受入側Yの貢献利益が全社の差額利益と一致する（符号が揃う）か。振替価格にXの固定費が入ると×"],["業績測定","供給側Xの貢献利益か営業利益が、仕組みとしてゼロになるなら×。赤字なだけなら○"]],"parts":[{"h":null,"judge":[["「いずれの事業部にも遊休生産能力があり」","固定費は埋没。全社の差額利益は、外部売上高から両事業部の変動費を引いて出す"],["「目標売上高営業利益率10%として全部原価に対する加算額を決定」","全部原価を（1−10%）で割り戻して振替価格にする。10%を掛けて足さない"],["「全社の貢献利益を各事業部の変動費を基準に配賦して加算額を決定」","全社の差額利益を変動費の比で分け、Xの取り分に変動費を足して振替価格を逆算する"],["「各部門の営業利益が同額になるように補助金の授受を行う」","変動原価で振り替えてから、全社の営業利益を2で割った額に最終利益を揃える。補助金＝最終利益−営業利益"]],"steps":[["全社の差額利益を出す","遊休生産能力があれば固定費は埋没。外部売上高から両事業部の変動費を引く 利益率法（IRR）の型が出てこない"],"hl":"[補間]は/NPV÷NPVの差","acct":"工原","lec":["h19-2"],"video":{"blob":"fa49903534792c3f15dcd74feb5381f5","secs":374.46,"mb":4.4},"scenes":[[0,"問題の資料"],[25.87,"内部利益率：預金で考える"],[74.53,"内部利益率：19-5の投資案Aで確かめる"],[118.82,"問1：年金現価係数の目安"],[152.87,"問1：補間の式"],[213.07,"問1：答えの欄"],[233.31,"問2：追加資料と目安"],[258.01,"問2：20%と21%で試す"],[296.6,"問2：補間と意思決定"],[334.24,"まとめ"]],"script":[[["ずんだもん","今回は、工原の問題集19-5、内部利益率法の問題を解説するのだ。"],["めたん","投資案Aは、投資額20,000。1年目から4年目まで、毎年8,000入ってくるわ。"],["ずんだもん","4年後の売却価値はゼロなのだ。資本コストは10%なのだ。"],["めたん","現価係数の表が、10%と16%から26%まで並んでるわね。"],["ずんだもん","利益率は、小数点以下第3位を四捨五入なのだ。答えは21.87%のような形になるのだ。"],["めたん","問1はAを実行するか、問2はAとBのどちらかを選ぶ問題ね。"]],[["めたん","内部利益率はNPVが0になる割引率、って言われても、正直ピンとこないわ。"],["ずんだもん","まずは預金で考えるのだ。100円を預けたら、1年後に110円になったのだ。"],["めたん","それなら利率は10%ね。"],["ずんだもん","その通りなのだ。じゃあ1年後の110円を、10%で割り引いてみるのだ。"],["めたん","110÷1.1で100。預けた100とぴったり同じね。"],["ずんだもん","そうなのだ。受け取る額の現在価値から、預けた100を引くと0。NPVが0なのだ。"],["ずんだもん","5%で割り引くと、110÷1.05で104.76。NPVはプラス4.76なのだ。"],["めたん","15%だと、110÷1.15で95.65。今度はマイナス4.35ね。"],["ずんだもん","割引率を上げるほど、NPVは小さくなるのだ。そして0になるのは10%のときだけなのだ。"],["めたん","その10%って、預金の利率そのものじゃない。"],["ずんだもん","そこが大事なのだ。NPVが0になる割引率は、その投資が自分で稼ぐ利回りなのだ。"],["めたん","だから内部、なのね。外から与えられる率じゃなくて、投資の中から出てくる率。"]],[["ずんだもん","19-5の投資案Aでも同じなのだ。20,000を出して、毎年8,000が4年間入るのだ。"],["めたん","資本コストの10%で割り引くと、8,000×3.1698で25,358.4。"],["ずんだもん","20,000を引いて、NPVはプラス5,358.4なのだ。"],["めたん","じゃあ、割引率をどんどん上げていったら？"],["ずんだもん","21%でプラス323.2、22%でマイナス50.4なのだ。"],["めたん","21%と22%の間で、プラスからマイナスに変わる。そこでNPVがちょうど0になるのね。"],["ずんだもん","そうなのだ。その率が、投資案Aの内部利益率なのだ。"],["めたん","預金でいえば、投資案Aは年21%くらいの利率で回る預金ってことね。"],["ずんだもん","完璧なのだ。10%で回せれば合格の会社にとって、21%で回る案は実行すべきなのだ。"],["めたん","つまり内部利益率を出してから、資本コストと比べるのね。"],["ずんだもん","その通りなのだ。次は、その内部利益率を実際に出していくのだ。"]],[["ずんだもん","問1で埋まるのは、内部利益率が何%か、と、実行するかしないか、の2つの欄なのだ。"],["めたん","まずは式ね。NPVが0になる率を探すんだから。"],["ずんだもん","そうなのだ。8,000×年金現価係数−20,000＝0、になる率を探すのだ。"],["めたん","移項すると、年金現価係数は20,000÷8,000で2.5ね。"],["ずんだもん","毎年同じ額なので、この2.5がそのまま年金現価係数なのだ。"],["めたん","4年の年金現価係数を探すと、21%が2.5404、22%が2.4937。"],["ずんだもん","2.5はその間なので、答えは21%と22%の間なのだ。"],["めたん","ここまでは自力で出せてたのよね。"],["ずんだもん","そうなのだ。止まったのは、ここから先の補間だったのだ。"]],[["ずんだもん","21%と22%の間の、どこでNPVが0になるかを出すのが補間法なのだ。"],["めたん","まず両方の率で、NPVを出してみるのね。"],["ずんだもん","そうなのだ。21%なら、8,000×2.5404で20,323.2なのだ。"],["めたん","投資額20,000を引いて、プラス323.2。"],["ずんだもん","22%なら、8,000×2.4937で19,949.6なのだ。"],["めたん","今度はマイナス50.4。21%ではプラス、22%ではマイナスね。"],["ずんだもん","その間で0を通るのだ。0までの距離323.2を、全体の差で割るのだ。"],["めたん","全体の差は、323.2＋50.4で373.6。"],["ずんだもん","323.2÷373.6で、0.865なのだ。"],["めたん","21%から、0.865だけ右に進むのね。21%＋0.865で21.865。"],["ずんだもん","第3位を四捨五入して、21.87%なのだ。"],["めたん","解答の式だと、分子が20,323.2−20,000、分母が20,323.2−19,949.6ね。"],["ずんだもん","中身は323.2÷373.6で、同じなのだ。低い率のNPVを、NPVの差で割る、と覚えるのだ。"]],[["めたん","内部利益率は21.87%。資本コストの10%と比べるのね。"],["ずんだもん","Aだけを実行するかどうかなので、独立投資案の決め方なのだ。"],["ずんだもん","内部利益率が資本コストを上回れば、実行するのだ。"],["めたん","21.87%は10%を上回ってるから、実行する。"],["ずんだもん","解答欄は、内部利益率が21.87%なので、投資案Aを実行する、に丸なのだ。"]],[["ずんだもん","問2で埋まるのは、高いか低いか、と、どちらの投資案か、なのだ。"],["めたん","追加資料は投資案B。投資額30,000で、9,000、12,000、12,000、15,000ね。"],["ずんだもん","毎年の額がバラバラなのだ。だから投資額を割るだけでは決まらないのだ。"],["めたん","平均で当たりをつけるのよね。合計48,000÷4で12,000。"],["めたん","30,000÷12,000で2.5。Aと同じ、21%と22%の間かしら。"],["ずんだもん","それはあくまで目安なのだ。実際に割り引いて確かめるのだ。"]],[["ずんだもん","まず21%で、各年の現価係数を掛けて足すのだ。"],["めたん","0.8264×9,000＋(0.6830＋0.5645)×12,000＋0.4665×15,000。"],["ずんだもん","合計は29,405.1なのだ。"],["めたん","30,000に届いてない。21%でもうマイナスね。"],["ずんだもん","そうなのだ。今度は目安が高すぎたのだ。1つ下の20%で試すのだ。"],["めたん","0.8333×9,000＋(0.6944＋0.5787)×12,000＋0.4823×15,000。"],["ずんだもん","30,011.4なのだ。投資額を11.4だけ上回るのだ。"],["めたん","20%でプラス、21%でマイナス。だから20%と21%の間ね。"],["ずんだもん","最初の後ろの3年で12,000が2回続くので、係数を足してから掛けると早いのだ。"]],[["ずんだもん","補間は問1と同じやり方なのだ。"],["めたん","20%のNPVは11.4。全体の差は30,011.4−29,405.1で606.3。"],["ずんだもん","11.4÷606.3で0.019なのだ。"],["めたん","20%に足して、20.02%。"],["ずんだもん","正解なのだ。問1の補間を見た後、同じやり方でここまで出せていたのだ。"],["めたん","次は、AとBのどちらを選ぶかね。"],["ずんだもん","追加資料に、AとBは相互排他的投資案とあるのだ。どちらか1つしか選べないのだ。"],["ずんだもん","相互排他的なら、内部利益率が高い方を選ぶのだ。資本コストとの比べはいらないのだ。"],["めたん","Aは21.87%、Bは20.02%。Aの方が高いわ。"],["ずんだもん","解答欄は、内部利益率が高い、に丸、投資案A、なのだ。"]],[["ずんだもん","最後に、解き方をまとめるのだ。"],["ずんだもん","1つ目、投資額÷毎年のキャッシュで、年金現価係数の目安を出すのだ。"],["めたん","毎年同じ額なら、それがそのまま年金現価係数。バラバラなら、平均で目安をつける。"],["ずんだもん","2つ目、目安を挟む2つの率でNPVを出して、プラスとマイナスに分かれるのを確かめるのだ。"],["めたん","分かれなかったら、隣の率も試す。Bみたいにね。"],["ずんだもん","3つ目、低い率のNPVを、2つのNPVの差で割って、低い率に足すのだ。"],["めたん","最後は、独立なら資本コストと比べて、相互排他的なら高い方を選ぶ。"],["ずんだもん","完璧なのだ。解説の最後にある通り、相互排他的ではNPV法と結論が変わることもあるのだ。"],["めたん","企業は、NPVの金額が大きい方を好むから、NPV法の方が優れてるってことね。"],["ずんだもん","その通りなのだ。補間の式は、3つ目の1行だけ覚えれば解けるのだ。"]]],"shorts":[{"hl":"[補間]は低い率のNPV÷/NPVの差","at":152.87,"blob":"e97c3ba920a1b608585bd0cc9cc7c9e6"},{"hl":"内部利益率は/[NPVが0]になる率","at":25.87,"blob":"63c0804eb50ad3a1e1343ca29735c271"},{"hl":"寸劇：[補間]は低い率のNPV÷/NPVの差","at":152.87,"blob":"c333ac475c19bb7f9265788a51bc8eee"},{"hl":"寸劇：内部利益率は/[NPVが0]になる率","at":25.87,"blob":"1ff635f5e296d6c683e64051c1404f87"}],"zabout":["工原19-5は、内部利益率法で投資案を選ぶ問題なのだ。","内部利益率は、NPVがちょうど0になる割引率のことなのだ。資本コストの10%は途中の計算には使わず、最後に比べるときだけ使うのだ。","問1は投資案Aだけなのだ。毎年8,000が4年間入るので、20,000÷8,000＝2.5がそのまま年金現価係数なのだ。表を見ると、21%の2.5404と22%の2.4937の間なのだ。","問2は投資案Bが加わるのだ。毎年の額がバラバラなので、平均12,000で目安をつけると21%と22%の間。でも21%で割り引くと29,405.1で30,000に届かないので、20%と21%で試して20.02%になるのだ。","AとBはどちらか1つしか選べない相互排他的投資案なので、内部利益率が高いAを実行するのだ。"],"drops":[{"prob":"工原19-5","at":"2026-09-29","kind":"stop","pair":null,"what":"問1の内部利益率の補間計算（21%＋(20,323.2−20,000)÷(20,323.2−19,949.6)）の式が自力で立てられず、答えを見て21.87%と記入した","n":1,"vs":"new","seek":152.87,"zwhat":["キミが止まったのは、21%と22%の間まで分かった後の、補間の式なのだ。目安の2.5と、挟む2つの率までは自力でできていたのだ。","まず両方の率でNPVを出すのだ。21%は8,000×2.5404−20,000でプラス323.2、22%は8,000×2.4937−20,000でマイナス50.4なのだ。","0になるのは、プラスとマイナスの間なのだ。低い率のNPVを、2つのNPVの差で割るのだ。323.2÷(323.2＋50.4)＝0.865なのだ。","それを低い率に足して、21%＋0.865＝21.87%なのだ。解答の式(20,323.2−20,000)÷(20,323.2−19,949.6)も、中身は同じ323.2÷373.6なのだ。","「低い率のNPV÷NPVの差を、低い率に足す」。この1行だけ覚えれば、問2の20.02%も同じやり方で出せるのだ。"]}]},{"kind":"prob","id":"pK7-5","no":"工原7-5","title":"ロット別個別原価計算","sub":"工原","ch":7,"probs":[],"w":1.0,"wt":["分割納入制で、指図書を完成品と仕掛品に分ける所で止まる"],"hl":"[分割納入制]は/進捗度がある指図書だけ分ける","acct":"工原","lec":["k7-4"],"video":{"blob":"a22016c695460ea8d01e2989826ed71e","secs":252.27,"mb":3.1},"scenes":[[0,"問題の資料"],[47.91,"問1：個別原価計算表を作る"],[89.26,"問1：一部でも未完成なら全部仕掛品"],[115.82,"問2：分割納入制とは"],[134.31,"問2：No.11を完成と仕掛に分ける"],[167.83,"問2：No.13で止まる"],[206.48,"問2：答えの欄"],[224.6,"まとめ"]],"script":[[["ずんだもん","今回は、工原の問題集7-5、ロット別個別原価計算の問題を解説するのだ。"],["めたん","ロット別個別原価計算って、ふつうの個別原価計算と何が違うの？"],["ずんだもん","1枚の製造指図書で、同じ製品をまとめて何個も作るのだ。そのまとまりをロットというのだ。"],["ずんだもん","この問題の指図書は、No.11からNo.14の4つなのだ。"],["めたん","No.12とNo.14は、受注した分が全部完成しているわ。"],["ずんだもん","No.11は200個のうち100個、No.13は150個のうち100個しか完成していないのだ。"],["めたん","材料はすべて作業の開始時点で投入、って書いてあるわ。"],["めたん","それと、No.11の未完成の100個は、仕上がり程度が50%なのね。"],["ずんだもん","この一文が、あとで大事になるのだ。"]],[["ずんだもん","問1で埋まるのは、月末仕掛品原価と、当月完成品原価の2つの欄なのだ。"],["ずんだもん","まずは指図書ごとに原価を集めるのだ。材料費は、消費量に予定消費価格の500円を掛けるのだ。"],["めたん","No.11なら120キロで、60,000ね。"],["ずんだもん","労務費は、作業時間に予定消費賃率の800円を掛けるのだ。No.11は50時間で40,000なのだ。"],["めたん","製造間接費は、直接労務費の200%を予定配賦、ってあるわ。"],["ずんだもん","40,000の2倍で80,000なのだ。"],["めたん","No.11の合計は180,000ね。"],["ずんだもん","No.12からNo.14も同じように出すと、この計の行になるのだ。"],["めたん","この12個の数字は、答案でも全部合ってたわ。"]],[["めたん","問1には、分割納入制の話が出てこないわね。"],["ずんだもん","だから原則どおり、ロットの一部でも未完成なら、その指図書は全部月末仕掛品なのだ。"],["めたん","受注した分が全部そろわないと、引き渡せないってことね。"],["ずんだもん","その通りなのだ。No.11とNo.13が仕掛品で、180,000と151,000を足して331,000なのだ。"],["めたん","完成品はNo.12とNo.14で、226,000と107,000を足して333,000になるわ。"],["ずんだもん","問1は答案も完答だったのだ。全部完成する必要がある、と横に書けていたのだ。"]],[["ずんだもん","問2で埋まるのも、同じ2つの欄なのだ。ただし、分割納入制を採用している場合なのだ。"],["めたん","分割納入制って、完成した分から先に得意先へ渡すやり方よね。"],["ずんだもん","そうなのだ。渡した分は完成品、まだの分は仕掛品。1つの指図書の原価を2つに分けるのだ。"],["めたん","問1では丸ごと仕掛品だったNo.11とNo.13を、分けるってことね。"]],[["ずんだもん","まずNo.11なのだ。200個のうち100個が完成、残り100個は仕上がり50%なのだ。"],["めたん","材料は始点投入だから、仕掛品の100個にも材料は全部入ってるわね。"],["ずんだもん","そうなのだ。材料費60,000を200個で割って、仕掛品の100個分で30,000なのだ。"],["めたん","加工費は、仕上がり50%だから、100個を50個分として数えるのよね。"],["ずんだもん","No.11の加工費は120,000なのだ。完成100個と仕掛50個分の、150個分で割るのだ。"],["めたん","150個分のうち50個分だから、40,000ね。"],["ずんだもん","仕掛品は30,000と40,000で70,000。完成品は180,000から引いて110,000なのだ。"],["めたん","ここまでは、答案の下書きにも出てたわ。"]],[["めたん","次はNo.13ね。150個のうち100個が完成してるわ。でも、残り50個の仕上がり程度が書いてないわ。"],["めたん","進捗度が分からないと、分けようがないじゃない。ここで手が止まっちゃう。"],["ずんだもん","そこが、答案で止まった所なのだ。資料をもう一度読むのだ。"],["めたん","月末においてNo.11の未完成分100個の仕上がり程度が50%、って書いてあるわ。……No.11のことしか書いてないのね。"],["ずんだもん","そうなのだ。仕上がり程度を書いているのは、No.11だけなのだ。"],["ずんだもん","解答は、No.13の151,000を全部完成品原価にしているのだ。残り50個は、まだ加工に入っていない扱いなのだ。"],["めたん","つまり、151,000は完成した100個だけにかかった原価ってことね。"],["ずんだもん","そう読むのだ。問題文にはっきりとは書いていないので、この問題の解答の読み方として押さえるのだ。"],["めたん","分けるのは、仕上がり程度が書いてある指図書だけ、ね。"]],[["ずんだもん","月末仕掛品原価は、No.11の70,000だけなのだ。"],["めたん","完成品は、4つの指図書の完成品原価を全部足すのね。"],["ずんだもん","足して594,000なのだ。"],["めたん","検算すると、70,000と594,000を足して664,000になるわ。4つの指図書の合計と同じね。"],["ずんだもん","ぴったりなのだ。解答欄は、①が70,000、②が594,000なのだ。"]],[["ずんだもん","最後に、解き方をまとめるのだ。"],["ずんだもん","1つ目、分割納入制の指示が無ければ、一部でも未完成の指図書は全部仕掛品なのだ。"],["めたん","2つ目、分割納入制なら、指図書の中で完成品と仕掛品に分けるのね。材料は個数で、加工費は仕上がり程度で分けるわ。"],["ずんだもん","3つ目、この問題では、仕上がり程度が書いてあるのはNo.11だけなのだ。No.13は全部完成品原価に入れるのだ。"],["めたん","進捗度が無くて止まったら、資料がどの指図書のことを言っているか読み直す、ね。"],["ずんだもん","完璧なのだ。講義7-4の分割納入制の場面も、あわせて見ておくのだ。"]]],"shorts":[{"hl":"[No.13]は全部/完成品原価","at":167.83,"blob":"e48bb83d7d15acf1c589c38c20bf49b1"},{"hl":"寸劇：[No.13]は全部/完成品原価","at":167.83,"blob":"2cf81d7c3734cfa5eb0d9b6a97edaed4"}],"zabout":["工原7-5は、ロット別個別原価計算で、月末仕掛品原価と完成品原価を出す問題なのだ。","指図書はNo.11からNo.14の4つ。材料は消費量×500円、労務費は作業時間×800円、製造間接費は直接労務費の200%で、合計はNo.11が180,000、No.12が226,000、No.13が151,000、No.14が107,000なのだ。","問1は分割納入制の指示が無いので、一部でも未完成のNo.11とNo.13は全部仕掛品なのだ。仕掛品331,000、完成品333,000なのだ。","問2は分割納入制なので、指図書の中で完成品と仕掛品に分けるのだ。仕掛品はNo.11の70,000だけ、完成品は594,000なのだ。"],"drops":[{"prob":"工原7-5","at":"2026-09-29","kind":"stop","pair":null,"what":"問2で No.13 の未完成分の加工進捗度を探して止まり、問2①②を空欄にした（No.11 の70,000／110,000は下書きに出ていた）","n":2,"vs":"new","seek":167.83,"zwhat":["キミが止まったのは、問2のNo.13なのだ。150個のうち100個が完成で、残り50個の仕上がり程度が資料に無いので、分けられなくなったのだ。","資料が仕上がり程度50%と書いているのは、No.11の未完成分だけなのだ。解答は、No.13の151,000を全部完成品原価にしているのだ。残り50個は、まだ加工に入っていない扱いなのだ。","問題文にはっきりとは書いていないので、この問題の解答の読み方として押さえるのだ。分けるのは、仕上がり程度が書いてある指図書だけなのだ。","No.11は下書きで分けられていたのだ。材料は始点投入なので60,000÷200個×100個＝30,000、加工費は120,000÷150個×50個＝40,000で、仕掛品70,000なのだ。"]}]},{"kind":"prob","id":"pK19-7","no":"工原19-7","title":"タックス・シールド","sub":"工原","ch":19,"probs":[],"w":2.906,"wt":["減価償却費を足すか足さないか（NCFが与えられているかで変わる）","税引後金額の ×(1−t) と、タックス・シールドの ×t を混ぜる","法人税率が資料にあるのに、税を入れずにCFを組む"],"hl":"[税金]を忘れない/減価償却費は×税率だけ","acct":"工原","lec":["h19-4"],"video":{"blob":"3e3b6af7a9bf0306966907605e719714","secs":206.4,"mb":2.5},"scenes":[[0,"問題の資料"],[41.08,"減価償却費を出す"],[53.66,"1〜3年：税金を忘れない"],[107.67,"4年：売却損の節税効果"],[133.48,"問2：NPVを出す"],[181.89,"まとめ"]],"script":[[["ずんだもん","今回は、工原の問題集19-7、タックス・シールドの問題を解説するのだ。"],["めたん","設備の取得原価は40,000ね。耐用年数は4年で、残存価額は10%よ。"],["めたん","4年後の売却価値は、2,000って書いてあるわ。"],["めたん","毎年の税引前正味現金流入額は、1年目から4年目まで16,000ずつね。……税引前正味現金流入額って何？"],["ずんだもん","その年に入ってくる現金から、出ていく現金を引いた額なのだ。正味は差し引き、という意味なのだ。"],["ずんだもん","税引前なので、法人税を払う前の額なのだ。ここが今日の急所なのだ。"],["めたん","資本コストは10%ね。これは、投資に最低限求める利回りよね。"],["ずんだもん","その通りなのだ。現価係数は、将来のお金を今の価値に直すための掛け率なのだ。"],["めたん","それと、法人税率は40%よ。"],["ずんだもん","問1は毎年のネット・キャッシュ・フロー、問2はNPVで投資するかどうか、なのだ。"]],[["ずんだもん","まずは減価償却費なのだ。取得原価から残存価額を引いて、4年で割るのだ。"],["めたん","残存価額は40,000の10%で4,000になるわ。36,000を4年で割って、9,000ね。"],["ずんだもん","ここは答案でも、問題文の横に9,000と書けていたのだ。"]],[["ずんだもん","問1で埋まるのは、0年から4年までの5つの欄なのだ。"],["めたん","ネット・キャッシュ・フローは、その年の現金の出入りを差し引いた額よね。"],["めたん","0年は設備を買うから、マイナス40,000ね。"],["めたん","1年目からは、毎年の16,000に、減価償却費の9,000を足して25,000にしちゃったわ。"],["ずんだもん","そこが答案と同じ間違いなのだ。資料の法人税率40%を、使っていないのだ。"],["めたん","あ、税金を忘れてた。題もタックス・シールドなのに。"],["ずんだもん","それに、16,000は税引前の正味現金流入額なのだ。もう現金の出入りの額なので、減価償却費を丸ごと足すことはしないのだ。"],["めたん","じゃあ、減価償却費はどこに出てくるのよ。"],["ずんだもん","税金を減らす所に出てくるのだ。減価償却費は費用になるので、課税所得が16,000から7,000に減るのだ。"],["めたん","税金は7,000に40%を掛けて2,800になるわ。減価償却費が無かったら、16,000に掛けて6,400ね。"],["ずんだもん","その差の3,600だけ、出ていく税金が減るのだ。これがタックス・シールドなのだ。"],["めたん","でも、税金が減っても、現金が入ってくるわけじゃないわよね。"],["ずんだもん","その通りなのだ。入ってくるのではなく、出ていくお金が3,600減るのだ。その分だけ、手元に現金が残るのだ。"],["ずんだもん","税率が無い問題なら、減らす税金が無いので、減価償却費は出てこないのだ。16,000がそのままキャッシュ・フローになるのだ。"],["めたん","手元に残るのは、16,000から税金2,800を引いた13,200ね。"],["ずんだもん","解答では、これを2つに分けて計算しているのだ。16,000の60%と、減価償却費9,000の40%なのだ。"],["めたん","16,000の60%で9,600になるわ。そこに3,600を足して、13,200ね。"],["ずんだもん","同じ13,200なのだ。1年目から3年目の欄は、13,200なのだ。"]],[["ずんだもん","4年目は、13,200に売却の分が加わるのだ。"],["めたん","売却価値の2,000を足して、15,200ね。"],["ずんだもん", 2は6,700なのだ。"]],[["ずんだもん","最後に、解き方をまとめるのだ。"],["ずんだもん","1つ目、固定費がやめても消えないなら、価格低限は変動費の合計なのだ。"],["めたん","2つ目、やめたら消える個別固定費があれば、1個あたりにして足すのね。"],["ずんだもん","3つ目、足すかどうかは、やめたら消えるかで決めるのだ。個別固定費と書いていない固定費は足さないのだ。"],["めたん","固定販売費は、やめても消えないから足さない、ね。"],["ずんだもん","完璧なのだ。講義15-6の、価格の下限の場面もあわせて見ておくのだ。"]]],"shorts":[{"hl":"足すのは[やめたら消える]/固定費だけ","at":47.77,"blob":"e84d75d18e20ed76b95252059ed04b7e"},{"hl":"寸劇：足すのは[やめたら消える]/固定費だけ","at":47.77,"blob":"1b9716dc758d5319e3c25821e2997243"}],"zabout":["工原18-2は、製品Qの価格低限、つまり短期的に損失を出さない最低限の値段を出す問題なのだ。","変動費は直接材料費1,500円・変動加工費4,000円・変動販売費200円で、合計5,700円なのだ。固定加工費は年5,000,000円で基準操業度5,000個、固定販売費は年3,000,000円なのだ。","問1は固定費が作っても作らなくてもかかるので、価格低限は変動費の5,700円なのだ。","問2は固定加工費が個別固定費で、やめれば消えるので、5,000,000÷5,000個＝1,000円を足して6,700円なのだ。固定販売費は個別固定費と書いていないので足さないのだ。"]},{"kind":"prob","id":"pK19-8","no":"工原19-8","title":"正味運転資本","sub":"工原","ch":19,"probs":[],"w":0.906,"wt":["正味運転資本を、残高のままキャッシュ・フローにする"],"hl":"CFは[残高ではなく増減]/終わる年に丸ごと戻る","acct":"工原","lec":["k21-2"],"video":{"blob":"6d23e88104d0acf0ff379a42a44e4e5b","secs":139.56,"mb":1.7},"scenes":[[0,"問題の資料"],[24.75,"問1：残高をそのままキャッシュ・フローにしない"],[62.47,"問2の資料：次の年の売上高の10%"],[83.45,"問2：4年目の80,000は何との差か"],[115.13,"まとめ"]],"script":[[["ずんだもん","今回は、工原の問題集19-8、正味運転資本の問題を解説するのだ。"],["めたん","正味運転資本って何？"],["ずんだもん","棚卸資産と売上債権を足して、仕入債務を引いた額なのだ。商売を回すために、寝かせておくお金なのだ。"],["めたん","投資案Aは3年で、棚卸資産、売上債権、仕入債務の残高が年ごとに書いてあるわ。"],["ずんだもん","現在なら、100,000と200,000を足して150,000を引くので、150,000なのだ。"],["めたん","同じように出すと、1年目は250,000、2年目は400,000になるわ。"]],[["ずんだもん","問1は、各年の運転資本にかかるキャッシュ・フローなのだ。"],["めたん","じゃあ1年目は、残高の250,000がマイナスのキャッシュ・フローね。"],["ずんだもん","そこが違うのだ。キャッシュ・フローになるのは、残高ではなく、前の年からの増減なのだ。"],["ずんだもん","現在の150,000は、もう寝かせてあるお金なのだ。1年目は、そこから100,000増やす分だけ、新しく現金が出ていくのだ。"],["めたん","だから1年目はマイナス100,000なのね。2年目は400,000から250,000を引いて、マイナス150,000ね。"],["ずんだもん","3年目は投資が終わるので、残高は0に戻るのだ。"],["めたん","寝かせていた400,000が、全部戻ってくるのね。"],["ずんだもん","そうなのだ。3年目はプラス400,000なのだ。"],["めたん","出ていった150,000と100,000と150,000を足すと、ちょうど400,000になるわ。"],["ずんだもん","それが検算なのだ。運転資本は最後に全部戻るので、全部足すと0になるのだ。"]],[["ずんだもん","投資案Bは4年で、売上高だけが書いてあるのだ。"],["めたん","正味運転資本は、次の年度の売上高の8%と6%を足して、4%を引くのね。"],["ずんだもん","そうなのだ。まとめると、次の年度の売上高の10%なのだ。"],["めたん","次の年度、ってところが大事ね。0年目は、1年目の売上高400,000の10%で、40,000になるわ。"],["ずんだもん","1年目から3年目も同じように出すと、この行になるのだ。"]],[["ずんだもん","キャッシュ・フローは、ここでも前の年からの増減なのだ。"],["めたん","0年目はマイナス40,000、1年目は60,000から40,000を引いて、マイナス20,000ね。"],["ずんだもん","2年目はマイナス40,000、3年目は残高が減るので、プラス20,000なのだ。"],["めたん","4年目の80,000は、何と比べてるのかしら。4年目の残高は、書いてないわよね。"],["ずんだもん","比べる相手は、いつも前の年の残高なのだ。4年目で投資が終わるので、4年目の残高は0なのだ。"],["ずんだもん","3年目の残高80,000が丸ごと戻るので、4年目はプラス80,000なのだ。"],["めたん","問1の3年目と同じ形ね。最後の年に、寝かせていたお金が全部戻ってくるわ。"],["ずんだもん","その通りなのだ。5つを全部足すと、ちょうど0になるのだ。"]],[["ずんだもん","最後に、解き方をまとめるのだ。"],["ずんだもん","1つ目、正味運転資本は、棚卸資産と売上債権を足して、仕入債務を引くのだ。"],["めたん","2つ目、キャッシュ・フローは残高ではなく、前の年からの増減ね。増えたらマイナス、減ったらプラスよ。"],["ずんだもん","3つ目、投資が終わる年は残高が0になるので、前の年の残高が丸ごと戻るのだ。"],["めたん","売上高で指示されたら、次の年度の売上高を使う、ね。"],["ずんだもん","完璧なのだ。講義21-2の冒頭の、正味運転資本の場面もあわせて見ておくのだ。"]]],"shorts":[{"hl":"CFは残高ではなく/[前の年からの増減]","at":24.75,"blob":"218cff31f882a1ef9f8c79c01c81abd2"},{"hl":"最後の年は/[残高0]と比べる","at":83.45,"blob":"00f8549106d9f16029e04f6498be0b89"},{"hl":"寸劇：CFは残高ではなく/[前の年からの増減]","at":24.75,"blob":"bb4b7d919745bffe863aacb646e68c1e"},{"hl":"寸劇：最後の年は/[残高0]と比べる","at":83.45,"blob":"5c6dea2c370a652462d2e4d4a3eef9f4"}],"zabout":["工原19-8は、設備投資で、運転資本にかかる毎年のキャッシュ・フローを出す問題なのだ。","正味運転資本は、棚卸資産と売上債権を足して、仕入債務を引いた額なのだ。キャッシュ・フローになるのは、残高ではなく前の年からの増減なのだ。","問1の投資案Aは、残高が150,000・250,000・400,000と増えるので、1年目△100,000、2年目△150,000、投資が終わる3年目は400,000が丸ごと戻って＋400,000なのだ。","問2の投資案Bは、次の年度の売上高の10%が残高なのだ。0年目△40,000、1年目△20,000、2年目△40,000、3年目＋20,000、4年目は3年目の残高80,000が戻って＋80,000なのだ。"]},{"kind":"prob","id":"pK2-1","no":"工原2-1","title":"材料副費","sub":"工原","ch":2,"probs":[],"w":0.75,"wt":["外部材料副費（引取費用）と内部材料副費の分け方","検算のシグナルを鳴らしたのに原因に辿り着かない"],"hl":"引取費用は[外部の5つ]だけ/保管費は内部","acct":"工原","lec":["k2-1"],"video":{"blob":"1fcebeeb3518f78b3af753a9029717c6","secs":286.13,"mb":3.6},"scenes":[[0,"問題の資料"],[30.31,"問1：副費を全部足す"],[55.19,"問2：引取費用だけを足す"],[123.89,"問2：外部と内部の見分け方"],[159.16,"問3：予定消費価格との差異"],[199.22,"問4：材料副費を予定配賦する"],[259.43,"まとめ"]],"script":[[["ずんだもん","今回は、工原の問題集2-1、材料副費の問題を解説するのだ。"],["めたん","材料副費って、材料の代金とは別にかかる費用のことかしら。"],["ずんだもん","そうなのだ。運賃や保険料、倉庫の保管費のように、材料を買って使えるようにするまでにかかる費用なのだ。"],["ずんだもん","材料Xは3,700キロ買って、送り状価額は1,498,500なのだ。これに副費を足したものが、購入原価なのだ。"],["めたん","副費は、6種類も並んでるわね。"],["ずんだもん","月初と月末の在庫も書いてあるのだ。"],["めたん","単価は総平均法で出すのね。"],["ずんだもん","その通りなのだ。月初と当月の金額を足して、数量の合計で割るのだ。"]],[["ずんだもん","問1で埋まるのは、材料副費を全部足したときの、消費単価の欄なのだ。"],["めたん","6つの副費を全部足すと、88,600になるわ。答案にも書いてあったわ。"],["ずんだもん","送り状価額に足して、当月の購入原価は1,587,100なのだ。"],["めたん","それに月初の120,900を足して、月初と当月の4,000キロで割るのね。"],["ずんだもん","そうなのだ。427円になるのだ。"],["めたん","総平均法の下書きは、答案でも書けてたわね。"],["ずんだもん","答案でも合っていたのだ。解答欄の問1は、427円なのだ。"]],[["ずんだもん","問2は、購入代価に引取費用だけを足したときの、消費単価なのだ。"],["めたん","引取費用って、外部材料副費のことよね。"],["ずんだもん","そうなのだ。材料を買って工場に届くまでに、会社の外に払う費用なのだ。"],["めたん","答案では、引取運賃と買入手数料と保管費と関税の4つに、丸を付けたわ。"],["ずんだもん","そこが違うのだ。保管費は入らなくて、代わりに保険料が入るのだ。"],["めたん","保管費だって、材料のためにかかる費用じゃない。なんで入らないのよ。"],["ずんだもん","保管費は、自分の会社の倉庫で材料を預かる費用なのだ。会社の中でかかるので、内部材料副費なのだ。"],["めたん","保険料は、運ぶ途中の事故に備えて、保険会社に払うものね。"],["ずんだもん","そうなのだ。外の保険会社に払うので、外部材料副費なのだ。"],["めたん","答案の4つだと、69,200になってたわ。"],["ずんだもん","正しくは、引取運賃、保険料、買入手数料、関税の4つで、74,200なのだ。"],["めたん","保管費と保険料が入れ替わって、5,000ずれたのね。"],["ずんだもん","あとは問1と同じなのだ。月初と当月の購入原価を足して、4,000キロで割るのだ。"],["めたん","今度は423.4になるわ。答案の422.15とは違うわね。"],["ずんだもん","答案の足し算は合っていたのだ。違ったのは、どれを足したかだけなのだ。"],["めたん","小数になったのが気になって、足し算は確かめたのよね。"],["ずんだもん","正しい答えも423.4で、小数なのだ。端数が気になったら、足し算より先に、どの副費を選んだかを見直すのだ。"],["ずんだもん","解答欄の問2は、423.4円なのだ。"]],[["めたん","でも、6つのうちどれが外部か、毎回迷いそうね。"],["ずんだもん","外部材料副費は、この5つだけなのだ。"],["ずんだもん","買入の他に引取、と覚えるのだ。買入が買入手数料、にが荷役費、ほが保険料、かが関税、引取が引取運賃なのだ。"],["めたん","5つとも、会社の外の相手に払うものね。"],["ずんだもん","そうなのだ。どれも、その材料を買ったからかかったと、はっきり分かる費用なのだ。だから必ず購入原価に足すのだ。"],["めたん","名前が何々費で終わるものは、荷役費のほかは内部なのね。"],["ずんだもん","そうなのだ。保管費も購入事務費も内部なので、問2では購入原価に入れないのだ。"],["めたん","5つを覚えて、それ以外は内部、と決めればいいのね。"],["ずんだもん","その通りなのだ。内部の方は種類が多いので、外部の5つだけ覚えるのが早いのだ。"]],[["ずんだもん","問3は、問1で予定消費価格の420円を使ったときの、材料消費価格差異の欄なのだ。"],["めたん","予定消費価格は、前もって決めておく材料の単価よね。"],["ずんだもん","そうなのだ。予定の単価で材料費を計算して、実際の単価とのずれを差異にするのだ。"],["めたん","まず、当月に使った量が要るわね。月初と当月の分を足して、月末の分を引くわ。"],["ずんだもん","3,720キロなのだ。帳簿と実地の在庫が同じなので、減耗は無いのだ。"],["めたん","予定の420と実際の427の差、7円に3,720キロを掛けて、26,040になるわ。"],["ずんだもん","向きはどうなるのだ？"],["めたん","実際の単価の方が高いから、不利差異よね。答案では三角の印で書いたわ。"],["ずんだもん","正解なのだ。三角はマイナスと同じ意味なので、答案でも合っていたのだ。"],["ずんだもん","解答欄の問3は、マイナス26,040なのだ。"]],[["ずんだもん","問4は、材料副費配賦差異の欄なのだ。"],["めたん","問4は、答案の紙に刷られてなかったわね。"],["ずんだもん","そうなのだ。次のページの上にあったのだ。ここで最後まで解くのだ。"],["めたん","副費を、実際の額じゃなくて、前もって決めた率で材料に乗せるのね。"],["ずんだもん","それを予定配賦というのだ。材料副費配賦差異は、予定で乗せた副費と、実際にかかった副費の差なのだ。"],["めたん","まず率ね。年間予算の副費は、6つとも全部足すわ。"],["ずんだもん","そうなのだ。問4は副費を全部入れるので、保管費や購入事務費も足すのだ。"],["めたん","問題文には、予算購入数量の42,000キロもあるわ。こっちで割るのかしら。"],["ずんだもん","購入代価に基づいて、と書いてあるので、割るのは金額の方なのだ。キロの数字は、この問題では使わないのだ。"],["めたん","じゃあ、年間予算の副費を全部足して、1,008,000になるわ。"],["ずんだもん","それを予算の購入額16,800,000で割って、6%なのだ。"],["めたん","当月の送り状価額1,498,500に6%を掛けて、89,910を予定配賦するのね。"],["ずんだもん","そうなのだ。実際にかかった副費は、問1で足した88,600なのだ。"],["めたん","予定の方が多いから、有利差異かしら。"],["ずんだもん","その通りなのだ。実際が予定より少なく済んだので、有利なのだ。"],["ずんだもん","解答欄の問4は、プラス1,310なのだ。"]],[["ずんだもん","最後に、解き方をまとめるのだ。"],["ずんだもん","1つ目、消費単価は、月初と当月の購入原価を足して、数量の合計で割るのだ。"],["めたん","2つ目、引取費用は、買入の他に引取の5つだけね。保管費は内部よ。"],["ずんだもん","3つ目、予定配賦率は、年間の副費の予算を、予算の購入額で割るのだ。当月の購入代価に掛けて、実際と比べるのだ。"],["めたん","差異は、予定と比べて実際が多ければ不利、少なければ有利ね。"],["ずんだもん","完璧なのだ。講義2-1の、外部副費の語呂、買入の他に引取の場面もあわせて見ておくのだ。"]]],"shorts":[{"hl":"引取費用に/[保管費]は入らない","at":55.19,"blob":"ffa13434c011804b4756e5cb968ee2e4"},{"hl":"寸劇：引取費用に/[保管費]は入らない","at":55.19,"blob":"4689b93affe1f750db6968c8fff1727b"}],"zabout":["工原2-1は、材料副費を購入原価にどこまで入れるかで、材料の消費単価と差異を出す問題なのだ。","問1は副費を全部足して総平均法で427円、問2は外部材料副費（引取費用）だけを足して423.4円なのだ。外部は買入手数料・引取運賃・荷役費・保険料・関税の5つで、保管費は内部なのだ。","問3は予定消費価格420円との材料消費価格差異でマイナス26,040、問4は材料副費を購入代価の6%で予定配賦して、配賦差異はプラス1,310なのだ。"]},{"kind":"prob","id":"pK3-2","no":"工原3-2","title":"賃率差異","sub":"工原","ch":3,"probs":[],"w":0.75,"wt":["賃金勘定の左右（前月末未払＝貸方／当月末未払＝借方）","検算のシグナルを鳴らしたのに原因に辿り着かない"],"hl":"前月末未払は[右]・当月末未払は左/差異は要支払額と比べる","acct":"工原","lec":["k3-2"],"video":{"blob":"6e6777f7fb97319597c7ea67d5b1afbd","secs":287.33,"mb":3.6},"scenes":[[0,"問題の資料"],[34.48,"問2：直接工の時間を分ける"],[77.68,"直接工賃金：未払の左右"],[133.1,"問1：賃率差異は要支払額と比べる"],[177.41,"問1：貸借が合わないときの手がかり"],[208.55,"問3：製造間接費"],[260.97,"まとめ"]],"script":[[["ずんだもん","今回は、工原の問題集3-2、賃率差異の問題を解説するのだ。"],["めたん","直接工の予定消費賃率は、1時間900円って書いてあるわ。"],["ずんだもん","予定消費賃率は、実際の賃金が分かるのを待たずに、前もって決めておく1時間あたりの率なのだ。"],["めたん","実際の額を待たずに、先に900円で計算しちゃうってことね。"],["ずんだもん","資料には、払った額と、月末に払っていない未払の額が、人ごとに並んでいるのだ。"],["めたん","聞かれているのは、賃率差異と直接労務費と製造間接費の3つね。"],["ずんだもん","賃率差異は、予定の率で計算した額と、実際に当月の分として負担する賃金との差なのだ。"],["めたん","予定の額を先に出さないと、差も出せないわね。"],["ずんだもん","だから、予定の額が出てくる問2から見ていくのだ。"]],[["ずんだもん","ここで埋まるのは、問2の直接労務費の欄なのだ。"],["めたん","作業時間は、加工、段取、間接作業、手待の4つに分かれてるわね。"],["ずんだもん","直接労務費になるのは、製品を作るのに直接かかった時間の分だけなのだ。"],["めたん","加工と段取が直接で、間接作業と手待は間接よね。答案でも、ここは丸で囲んで分けてたわ。"],["ずんだもん","正解なのだ。手待時間は、材料待ちなどで手が空いて待っている時間なのだ。製品には直接かからないのだ。"],["めたん","じゃあ直接の時間は、加工と段取を足して4,600時間になるわ。"],["ずんだもん","その4,600時間に、予定の900円を掛けるのだ。"],["めたん","900円×4,600時間で、4,140,000円ね。"],["ずんだもん","問2の欄は4,140,000円。答案も正解だったのだ。"],["ずんだもん","残りの600時間に900円を掛けた540,000円は、製造間接費になるのだ。問3で使うのだ。"],["めたん","同じ直接工の賃金でも、時間の中身で行き先が変わるのね。"]],[["ずんだもん","ここからは問1の準備なのだ。直接工賃金の勘定を1枚書くのだ。"],["めたん","直接工に今月払ったのは、4,720,000円ね。"],["ずんだもん","支払賃金は、勘定の左に書くのだ。迷うのは、未払の2つをどっちに置くかなのだ。"],["めたん","答案では、前月末未払を左に、当月末未払を右に書いたわ。"],["ずんだもん","そこが逆なのだ。前月末未払は右、当月末未払は左に置くのだ。"],["めたん","なんで前月末の分が右なの？"],["ずんだもん","前月末未払は、前の月に働いてもらった分なのだ。今月の支払に混ざって出ていくだけなので、今月の分からは外すのだ。"],["めたん","今月払った額には、先月の分が混ざってるってことね。"],["ずんだもん","そうなのだ。逆に当月末未払は、今月働いてもらったのに、まだ払っていない分なのだ。"],["めたん","払ってなくても今月の分だから、左に足すのね。"],["ずんだもん","その通りなのだ。支払額から前月末未払を引いて、当月末未払を足したものを、要支払額というのだ。"],["めたん","要支払額は、今月の働きにちょうど見合う賃金のことね。"],["ずんだもん","正しい勘定だと、左は支払賃金と当月末未払、右の一番上が前月末未払になるのだ。"],["めたん","答案の勘定は、未払の2つが左右まるごと入れ替わってたのね。"]],[["ずんだもん","ここで埋まるのは、問1の賃率差異の欄なのだ。借方か貸方かも答えるのだ。"],["めたん","答案では、支払賃金から予定の4,680,000円を引いて、40,000円にしたわ。"],["ずんだもん","予定の4,680,000円は、900円に直接工の全部の時間5,200時間を掛けた額なのだ。そこは合っているのだ。"],["めたん","引く相手を支払賃金にしたのが、まずかったのかしら。"],["ずんだもん","そうなのだ。比べる相手は要支払額なのだ。支払額のままだと、未払の調整が抜けてしまうのだ。"],["めたん","支払額から前月末未払を引いて、当月末未払を足すと、4,728,000円になるわ。"],["ずんだもん","予定の4,680,000円との差で、48,000円なのだ。"],["めたん","実際の方が多いから、不利な差異で借方になるわね。"],["ずんだもん","そうなのだ。借方は、答案でも合っていたのだ。"],["ずんだもん","勘定で見ると、賃率差異は、左右の合計をそろえる貸借差額として出てくるのだ。"],["めたん","右の一番下に48,000円が入って、左右がそろうのね。"]],[["ずんだもん","実は、答案を書いている途中に、間違いに気づける手がかりがあったのだ。"],["めたん","そういえば解いてるとき、これ逆じゃないかって思ったのよ。貸借も合わなかったわ。"],["ずんだもん","気づいていたのだ！答案の勘定は、左の合計が右より8,000円少なかったのだ。"],["めたん","その8,000円が、どこから出てきたかが問題ね。"],["ずんだもん","当月末未払から前月末未払を引いた差が、ちょうど8,000円なのだ。"],["めたん","合わない額が、未払の2つを名指ししてたってことね。"],["ずんだもん","そうなのだ。貸借が合わなかったら、合わない額を引き算して、どの数字から来たかを探すのだ。"],["めたん","逆かもと思った時点で、入れ替えて計算してみればよかったわ。"],["ずんだもん","入れ替えれば、それで左右がぴったり合うのだ。"]],[["ずんだもん","最後は、問3の製造間接費の欄なのだ。"],["めたん","製造間接費には、何が入るのかしら。"],["ずんだもん","直接工の間接作業と手待の分、間接工の賃金、工場事務員の給料の3つなのだ。"],["めたん","間接工と事務員は、時間に関係なく全部間接になるのね。答案でも、そう分けてたわ。"],["ずんだもん","人の分け方は合っていたのだ。ずれたのは、ここでも未払の左右なのだ。"],["めたん","答案では、間接工も事務員も、前月末未払を足して、当月末未払を引いてたわ。"],["ずんだもん","直接工と同じで、前月末未払は引いて、当月末未払を足すのだ。"],["めたん","間接工は、支払額から前月末の分を引いて当月末の分を足すから、1,670,000円になるわ。"],["ずんだもん","間接工には予定の率が無いので、要支払額がそのまま製造間接費になるのだ。"],["めたん","事務員も同じ形で、2,455,000円になるわね。"],["ずんだもん","直接工の540,000円も合わせて3つを足すと、4,665,000円なのだ。"],["めたん","賃率差異の48,000円は、製造間接費に入れなくていいのね。"],["ずんだもん","入れないのだ。賃率差異は原価差異として、製造間接費とは別に扱うのだ。"]],[["ずんだもん","最後に、解き方をまとめるのだ。"],["ずんだもん","1つ目、直接工の時間は、加工と段取が直接労務費、間接作業と手待は製造間接費なのだ。"],["めたん","2つ目、賃金の勘定は、左に支払と当月末未払、右の上に前月末未払を置くのね。"],["ずんだもん","3つ目、賃率差異は、要支払額と予定消費額の差なのだ。勘定では貸借差額で出るのだ。"],["めたん","貸借が合わなかったら、合わない額を引き算して、どこから来たかを見るのね。"],["ずんだもん","完璧なのだ。講義3-2の、直接工賃金の勘定の場面もあわせて見ておくのだ。"]]],"shorts":[{"hl":"賃率差異は/[要支払額]と比べる","at":133.1,"blob":"ae092b76b5abd5c1cb6590ffd3fd40d2"},{"hl":"貸借が合わない額が/[原因]を指す","at":177.41,"blob":"cea0517c7dc6023827671e34d3ca96ce"},{"hl":"寸劇：賃率差異は/[要支払額]と比べる","at":133.1,"blob":"ad81f69e1b81628ad2f2f8d4d4137b10"},{"hl":"寸劇：貸借が合わない額が/[原因]を指す","at":177.41,"blob":"035e6ea83445ae10bfcdf85a75ae9ec6"}],"zabout":["工原3-2は、直接工の予定消費賃率900円で、賃率差異・直接労務費・製造間接費を出す問題なのだ。","直接労務費は加工と段取の4,600時間分で4,140,000、間接作業と手待の分は製造間接費に行くのだ。","賃率差異は、支払額から前月末未払を引いて当月末未払を足した要支払額4,728,000と、予定の4,680,000の差で48,000の借方なのだ。製造間接費は4,665,000なのだ。"]},{"kind":"prob","id":"pK4-2","no":"工原4-2","title":"直接経費","sub":"工原","ch":4,"probs":[],"w":0.75,"wt":["有償支給と無償支給の対比","最初に紙に書いた数字が、その後の判断の前提として固定される"],"hl":"聞かれた[指図書の列]だけ/無償支給は直接材料費","acct":"工原","lec":["k4-1"],"video":{"blob":"f00a6236825b4114ff0a923e406f664c","secs":179.19,"mb":2.2},"scenes":[[0,"問題の資料"],[31.76,"①直接材料費：701番の列だけを見る"],[84.61,"無償支給の材料も直接材料費"],[107.52,"②直接経費：A社への支払額"],[153.59,"まとめ"]],"script":[[["ずんだもん","今回は、工原の問題集4-2、直接経費の問題を解説するのだ。"],["めたん","材料Xは主要材料で、材料Yは外部のA社に外注のため渡してるのね。"],["ずんだもん","しかも、材料YはA社にただで渡しているのだ。これを無償支給というのだ。"],["めたん","A社は渡された材料Yを加工して、その加工賃を請求してくるわけね。"],["ずんだもん","そうなのだ。その請求額が、1キロあたり200円なのだ。"],["めたん","予定消費価格は、Xが1キロ600円、Yが500円ね。"],["ずんだもん","指図書は701番と702番の2つで、材料の消費量はこの表なのだ。"],["ずんだもん","問が聞いているのは、701番に集計される直接材料費と直接経費の2つなのだ。"]],[["ずんだもん","まず①の直接材料費なのだ。ここを解くと、解答欄の①が埋まるのだ。"],["めたん","材料Xは、表の2つを足して140キロね。答案では、それに600円を掛けて84,000にしたわ。"],["ずんだもん","そこが違うのだ。問は、701番の指図書に集計される分だけを聞いているのだ。"],["ずんだもん","50キロは702番の分なのだ。701番の列だけを見るのだ。"],["めたん","じゃあ材料Xは、90キロに600円を掛けて、54,000になるわね。"],["ずんだもん","その通りなのだ。"],["めたん","答案では、そのあと84,000を消して、154,000に書き直したわ。"],["ずんだもん","154,000は、140キロに、Xの600円とYの500円を両方掛けた額なのだ。"],["ずんだもん","材料Yも直接材料費に入れた所は、合っているのだ。でも、Yの数量までXと同じ140キロにしてしまったのだ。"],["めたん","Yの行を見ると、701番は30キロで、702番は横棒になってるわ。"],["ずんだもん","Yは、701番で30キロしか使っていないのだ。数量は、材料ごと、指図書ごとに違うのだ。"],["めたん","Yは、30キロに500円を掛けて、15,000になるわね。"],["ずんだもん","XとYを足して、①は69,000なのだ。"]],[["めたん","でも、Yはただで渡して外注してるのよね。答案でも、直接材料費でいいのか、書いたあとで迷ったわ。"],["ずんだもん","それでいいのだ。無償支給の材料も、ふつうの材料と同じく、消費量に予定消費価格を掛けるのだ。"],["ずんだもん","ただで渡しても、製品αを作るために材料Yを使ったことに変わりはないのだ。"],["めたん","材料を渡したあとは、加工をよそに頼んでいるだけ、ってことね。"],["ずんだもん","そうなのだ。だから材料の分は直接材料費、加工を頼んだ分は別に数えるのだ。"]],[["ずんだもん","次は②の直接経費なのだ。解答欄の②が埋まるのだ。"],["めたん","直接経費って、材料費でも労務費でもないのに、製品に直接結び付く原価のことよね。"],["ずんだもん","そうなのだ。物でも自社の人の労働力でもなく、どの製品のためか分かる原価なのだ。"],["めたん","A社の加工は、よその会社の人の労働力だから、労務費にはならないのね。"],["ずんだもん","その通りなのだ。A社に払う加工賃を外注加工賃といって、直接経費の代表なのだ。"],["めたん","701番のYは30キロで、請求額は1キロ200円だから、6,000になるわ。"],["ずんだもん","正解なのだ。②は答案でも6,000で合っていたのだ。"],["ずんだもん","②では、Yの30キロを正しく使えていたのだ。①の数量も、同じ目で見直せば取れたのだ。"],["めたん","材料の500円に加工の200円で、1キロに700円かかってる、って答案のときも考えたわ。"],["ずんだもん","その考え方で合っているのだ。500円の分が直接材料費、200円の分が直接経費に分かれるのだ。"],["ずんだもん","解答欄は、①が69,000、②が6,000なのだ。"]],[["ずんだもん","最後に、解き方をまとめるのだ。"],["ずんだもん","1つ目、問が聞いている指図書を先に確かめるのだ。この問題は701番だけなのだ。"],["めたん","2つ目、数量は材料ごと、指図書ごとに表から拾うのね。XとYで同じ数量とは限らないわ。"],["ずんだもん","3つ目、無償支給の材料は直接材料費、外注先に払う加工賃は直接経費なのだ。"],["めたん","解答欄に書く前に、その数字を表のどの行から取ったか、指で確かめるってことね。"],["ずんだもん","完璧なのだ。講義4-1の、直接経費はレアの場面もあわせて見ておくのだ。"]]],"shorts":[{"hl":"[701番の列]だけを/材料ごとに拾う","at":31.76,"blob":"68320029cfe964054c9cedd8af328bb0"},{"hl":"無償支給は/[材料費と加工賃]に分ける","at":84.61,"blob":"ca86afec968b95f06bd8bb9766b1b6e7"},{"hl":"寸劇：[701番の列]だけを/材料ごとに拾う","at":31.76,"blob":"23faeb661fc8cd2e204e60f56e83a84b"},{"hl":"寸劇：無償支給は/[材料費と加工賃]に分ける","at":84.61,"blob":"696ec3fa3f4fa76f42ac56a0cefedf2d"}],"zabout":["工原4-2は、#701に集計される直接材料費と直接経費を出す問題なのだ。","直接材料費は、#701の列だけを見て、材料X 90kg×600円と材料Y 30kg×500円で69,000なのだ。外注先に無償で渡した材料Yも直接材料費なのだ。","直接経費は、外注先A社への加工賃30kg×200円で6,000なのだ。"]},{"kind":"prob","id":"pK8-6","no":"工原8-6","title":"異常仕損費の処理②","sub":"工原","ch":8,"probs":[],"w":0.848,"wt":["「異常仕損費」は評価額を引いた後の額"],"hl":"異常仕損費は[評価額を引いた後]/正常仕損費を配っても同じ","acct":"工原","lec":["k8-4"],"video":{"blob":"b2c52d43cba5db2b5bc631b8dc74a787","secs":327.88,"mb":3.9},"scenes":[[0,"問題の資料"],[31.13,"問題文の指示：2つの考え方"],[81.22,"数量のボックス図"],[98.84,"問1①：異常仕損費"],[127.97,"問1：正常仕損費を2つに配る"],[165.76,"問1②：完成品総合原価"],[195.34,"問2：正常仕損費を異常仕損にも配る"],[222.13,"問2①：評価額を引き忘れた"],[254.03,"問2②：完成品総合原価と検算"],[300.44,"まとめ"]],"script":[[["ずんだもん","今回は、工原の問題集8-6、異常仕損費の処理の2つ目を解説するのだ。"],["めたん","仕損が2種類あるのね。正常仕損は40%の地点、異常仕損は50%の地点で出てるわ。"],["ずんだもん","異常仕損は、ふつうに出る範囲を超えて、多めに出てしまった失敗なのだ。そのコストが異常仕損費なのだ。"],["めたん","仕損品には、評価額もついてるわね。"],["ずんだもん","評価額は、失敗した品を売ったりして取り戻せる額なのだ。その分は、仕損のコストから引くのだ。"],["めたん","原価の配り方は、先入先出法ね。"],["ずんだもん","問1と問2は、異常仕損の扱い方だけが違うのだ。どちらも、異常仕損費と完成品総合原価の2つを答えるのだ。"]],[["めたん","2問とも、正常仕損費は非度外視法ね。"],["ずんだもん","非度外視法は、正常仕損費をいったん金額で出してから、負担させるものに配るやり方なのだ。"],["めたん","問1は、正常性概念を重視、って書いてあるわ。答案では、異常は配らない、ってメモしてたのよね。"],["ずんだもん","その読みで合っているのだ。正常性概念は、正常仕損費を異常仕損には負担させない考え方なのだ。"],["ずんだもん","正常な失敗のコストは、本来は売上原価に行くものなのだ。異常仕損に配ると特別損失に回って、段階損益がゆがむのだ。"],["めたん","だから、完成品と月末仕掛品の2つだけに配るのね。"],["ずんだもん","問2は、原価発生原因主義なのだ。"],["めたん","原価発生原因主義って、何を重視するの？"],["ずんだもん","正常仕損の地点を通ったものは、みんな正常仕損の原因になった、と考えるのだ。だから、通過していれば異常仕損にも負担させるのだ。"],["ずんだもん","多めに焦げただけの量的な異常なら、完成品と同じ扱いでいい、という考え方なのだ。"],["めたん","どっちの考え方にも、一理あるってことね。"],["ずんだもん","そうなのだ。どちらで解くかは、問題文の指示に従うのだ。"]],[["ずんだもん","まずは数量のボックス図を作るのだ。カッコの中は、加工費の計算に使う数なのだ。"],["めたん","当月投入の加工費の分は、差し引きで10,400になるわ。"],["ずんだもん","異常仕損は50%なので、400個を200個分として数えるのだ。"],["めたん","このボックス図は、答案でも同じ形に書けてたわ。"],["ずんだもん","正しく作れていたのだ。ここから、問1を解いていくのだ。"]],[["ずんだもん","問1の①、異常仕損費から出すのだ。"],["めたん","異常仕損品にかかった原価を出せばいいのよね。"],["ずんだもん","そうなのだ。ただし答えるのは、評価額を引いた後の額なのだ。ここが後で大事になるのだ。"],["めたん","原料費は、当月投入11,000個のうちの400個分ね。"],["ずんだもん","当月の原料費を個数の割合で配って、360,000なのだ。"],["めたん","加工費は、10,400個分のうち200個分で、220,500になるわ。"],["ずんだもん","2つを足して、異常仕損品の評価額75,000を引くのだ。"],["めたん","これで505,500ね。答案でもこうなってたわ。"],["ずんだもん","正解なのだ。問1では、評価額をちゃんと引けていたのだ。"]],[["ずんだもん","次は正常仕損費なのだ。これを完成品と月末仕掛品に配るのだ。"],["めたん","正常仕損1,000個の原料費と加工費を出して、評価額の198,000を引くのね。"],["ずんだもん","そうなのだ。評価額を引いてから配るのだ。"],["めたん","割る数は、当月投入から正常仕損と異常仕損を引いた9,600個ね。"],["ずんだもん","当月投入のうち、完成した8,000個と、月末の1,600個を足した数なのだ。"],["めたん","月初の1,000個は入れないのね。"],["ずんだもん","先入先出法なので、当月の仕損は当月投入から出たと考えるのだ。だから、当月投入の良品だけで分けるのだ。"],["めたん","月末仕掛品の分は、1,600個分で190,500になるわ。"],["ずんだもん","この分け方も、答案の下書きで合っていたのだ。8,000と1,600に丸が付いていたのだ。"],["めたん","月末仕掛品原価は、原料費と加工費に正常仕損費を足して出すのね。"]],[["ずんだもん","問1の②、完成品総合原価なのだ。"],["めたん","月初と当月の原価を全部足して、完成品以外を引けばいいのよね。"],["ずんだもん","そうなのだ。引くのは、月末仕掛品原価と異常仕損費、それに2つの評価額なのだ。"],["めたん","評価額も引くの？異常仕損費で、75,000はもう引いたじゃない。"],["ずんだもん","異常仕損費は、評価額を引いた後の額なのだ。評価額の分は、仕損品という別のものになって残るのだ。"],["ずんだもん","だから総額からは、異常仕損費と評価額を別々に引くのだ。正常仕損の評価額も同じなのだ。"],["めたん","引き残りが19,000,500で、答案でも正解ね。"],["ずんだもん","問1は完答なのだ。"]],[["ずんだもん","問2は、原価発生原因主義なのだ。正常仕損費そのものは、問1と同じ額なのだ。"],["めたん","違うのは配る先ね。異常仕損は50%で、正常仕損の40%の地点を通り過ぎてるわ。"],["ずんだもん","そうなのだ。通過しているので、異常仕損にも正常仕損費を負担させるのだ。"],["めたん","割る数は、異常仕損の400個を引かずに、10,000個になるのね。"],["ずんだもん","異常仕損の400個分は、45,720なのだ。"],["めたん","答案の下書きでも、この45,720は出せてたわ。"],["ずんだもん","配り方は合っていたのだ。問題は、この次なのだ。"]],[["ずんだもん","問2の①、異常仕損費なのだ。"],["めたん","異常仕損の原料費と加工費に、配ってきた45,720を足して、626,220になるわ。答案もこう書いたのよね。"],["ずんだもん","そこが違うのだ。異常仕損品の評価額75,000を、まだ引いていないのだ。"],["めたん","あ、問1では引いてたのに。"],["ずんだもん","異常仕損費は、いつも評価額を引いた後の額なのだ。正常仕損費を配ってきても、それは変わらないのだ。"],["ずんだもん","異常仕損も、正常仕損と品質は同じなのだ。多めに出ただけなので、ちゃんと評価額がつくのだ。"],["めたん","正しくは626,220から75,000を引いて、551,220になるわ。"],["ずんだもん","それが問2の①の答えなのだ。"]],[["ずんだもん","問2の②、完成品総合原価なのだ。まず、月末仕掛品に配る正常仕損費を出すのだ。"],["めたん","割る数は10,000個のままで、月末の1,600個分は182,880ね。"],["ずんだもん","原料費と加工費に足して、月末仕掛品原価が出るのだ。"],["めたん","あとは問1と同じように、総額から引いていくのね。"],["ずんだもん","引くのは、月末仕掛品原価と、評価額を引いた後の異常仕損費と、2つの評価額なのだ。"],["めたん","答えは18,962,400ね。ここは答案でも合ってたわ。"],["ずんだもん","答案では、月初の原価に、当月投入の完成分と、配ってきた正常仕損費を足して、直接出していたのだ。"],["めたん","足して出しても、引いて出しても、同じ額になるのね。"],["ずんだもん","そうなのだ。足し算で出していたので、異常仕損費の欄の間違いが、完成品には響かなかったのだ。"],["めたん","逆に言えば、引き算でも出して比べてたら、626,220のずれに気づけたってことね。"],["ずんだもん","その通りなのだ。2つの出し方が合うかを見れば、評価額の引き忘れが見つかるのだ。"]],[["ずんだもん","最後に、解き方をまとめるのだ。"],["ずんだもん","1つ目、正常仕損費を異常仕損に配るかは、問題文の指示で決めるのだ。正常性概念なら配らない、原価発生原因主義なら通過していれば配るのだ。"],["めたん","2つ目、異常仕損費は、正常仕損費を配ってきたあとでも、評価額を引いた後の額よね。"],["ずんだもん","3つ目、完成品総合原価は、総額から引いて出した額と、足して出した額が合うか確かめるのだ。"],["めたん","答える前に、評価額を引いたかを見るってことね。"],["ずんだもん","完璧なのだ。講義8-4の、異常仕損にも評価額の場面もあわせて見ておくのだ。"]]],"shorts":[{"hl":"異常仕損費は/[評価額を引いた後]","at":222.13,"blob":"0e8c472dfeea1609ee5b15811d31ae75"},{"hl":"寸劇：異常仕損費は/[評価額を引いた後]","at":222.13,"blob":"6517e8526ee1a162fa2aa43dbed31236"}],"zabout":["工原8-6は、非度外視法・先入先出法で、異常仕損費と完成品総合原価を2つの考え方で出す問題なのだ。","問1は正常性概念で、正常仕損費を異常仕損に配らないのだ。異常仕損費505,500、完成品総合原価19,000,500なのだ。","問2は原価発生原因主義で、正常仕損の地点を通った異常仕損にも正常仕損費を配るのだ。異常仕損費は評価額75,000を引いて551,220、完成品総合原価18,962,400なのだ。"]},{"kind":"prob","id":"pK10-1","no":"工原10-1","title":"組別総合原価計算","sub":"工原","ch":10,"probs":[],"w":0.075,"wt":[],"hl":"仕損の負担先を[製品ごとに]判定/評価額は個数に掛ける","acct":"工原","lec":["k10-1"],"video":{"blob":"fc4ba85686252c82b93e08401f080a88","secs":397.36,"mb":5.0},"scenes":[[0,"問題の資料"],[36.09,"問1：借方は組直接費と予定配賦"],[89.84,"問1：仕損の負担先をA・Bで判定"],[160.31,"問1：製品Aは両者負担で按分"],[196.51,"問1：製品Aの仕損品と完成品"],[217.26,"問1：製品Bは完成品のみ負担"],[244.73,"問1：仕損品Bは個数に掛ける"],[304.68,"問2：予算差異と操業度差異"],[365.66,"まとめ"]],"script":[[["ずんだもん","今回は、工原の問題集10-1、組別総合原価計算の問題を解説するのだ。"],["めたん","組別総合原価計算って、ふつうの総合原価計算と何が違うの？"],["ずんだもん","種類の違う製品を、別々のラインで続けて作るときの総合原価計算なのだ。この問題は製品AとBの2つなのだ。"],["めたん","じゃあ、AとBでボックス図を2つ描くことになるわね。"],["ずんだもん","そうなのだ。完成品の数も、月末の数も、製品ごとに分けて書いてあるのだ。"],["めたん","どっちにも正常仕損があるわ。かっこの中は、仕損が出た地点ね。"],["ずんだもん","この問題の山場は、その仕損の原価をどこに負担させるか、なのだ。"],["めたん","1回目と2回目は、そこで手が止まっちゃったのよね。3回目で、やっと通ったわ。"],["ずんだもん","だから今日は、止まった所を順番にほどいていくのだ。"]],[["ずんだもん","まず問1の仕掛品勘定なのだ。借方の、前月繰越と3つの費用の欄から埋めるのだ。"],["めたん","前月繰越は、月初仕掛品原価の合計をそのまま書けばいいわね。"],["ずんだもん","直接材料費と直接労務費は、製品ごとに分けて書いてあるのだ。"],["めたん","製品ごとに分かってる原価は、そのまま各製品に入れればいいのよね。"],["ずんだもん","そうなのだ。こういう原価を組直接費といって、各製品に賦課するのだ。"],["めたん","でも、問題文の製造間接費の当月の欄は、はてなになってるわ。"],["ずんだもん","製造間接費は会社全体でしか分からない組間接費なのだ。だから直接作業時間で配るのだ。"],["めたん","予定配賦率は、変動費率の300に、固定費予算を基準操業度で割った500を足して、800ね。"],["ずんだもん","そうなのだ。Aは6,570時間に800を掛けて、5,256,000なのだ。"],["めたん","Bは4,740時間に掛けて、3,792,000になるわね。実際発生額の9,060,000は、ここでは使わないのね。"],["ずんだもん","そうなのだ。仕掛品に入れるのは予定配賦額なのだ。実際との差は、問2の配賦差異になるのだ。"],["めたん","借方の8つの欄は、3回とも全部合ってたわ。"],["ずんだもん","ここは毎回できていたのだ。"]],[["ずんだもん","次は貸方の、製品と仕損品と次月繰越の欄なのだ。そのために、仕損の原価の行き先を決めるのだ。"],["めたん","度外視法は、仕損の原価を別に計算しないやり方よね。"],["ずんだもん","そうなのだ。仕損がなかったことにして、良品に自然に負担させるのだ。"],["めたん","でも、関係品に負担させる、としか書いてないわ。完成品と月末仕掛品の、どっちに持たせるのかしら？"],["ずんだもん","仕損の発生点と、月末仕掛品の進捗度を比べるのだ。月末仕掛品が発生点を通っていれば、両方で負担するのだ。"],["めたん","通っていなければ、完成品だけで負担するのね。"],["ずんだもん","製品Aは、仕損が2分の1の地点、月末仕掛品は6分の5なのだ。"],["めたん","月末の方が先まで進んでるから、発生点を通ってるわ。Aは両者負担ね。"],["ずんだもん","製品Bは、仕損が3分の2の地点、月末仕掛品は5分の1なのだ。"],["めたん","今度は月末がまだ手前ね。Bは完成品のみ負担になるわ。"],["ずんだもん","正解なのだ。同じ問題の中で、AとBで負担先が割れるのだ。"],["めたん","前の2回は、ここで止まっちゃったのよね。3回目は、問題文の横に、両者と、完のみ、を書いてから解いたわ。"],["ずんだもん","その一手で通ったのだ。前の2回は、度外視法と非度外視法の違いが思い出せなかった所なのだ。"],["めたん","ボックス図の換算量も、この発生点と進捗度で出すのね。"],["ずんだもん","そうなのだ。Aの月初は、1,000個の4分の1で250なのだ。1回目の答案は、ここを400にしていたのだ。"],["めたん","400って、Bの月初の換算量と同じ数じゃない。AとBを並べて描くと、混ざりやすいわ。"]],[["ずんだもん","まず製品Aの次月繰越の欄なのだ。両者負担なので、仕損の分を分母から除いて按分するのだ。"],["めたん","材料費は、当月投入の10,600から仕損の400を引いた数で割るのね。"],["ずんだもん","その前に、仕損品の処分価値を引くのだ。"],["ずんだもん","両者負担なら、按分する前に当月投入から引くのだ。"],["めたん","材料費からは、材料分の765に、仕損の400個を掛けて引くのね。"],["ずんだもん","そうして月末の1,200個分を出すと、812,000なのだ。"],["めたん","加工費からは、996から765を引いた231を、同じ400個に掛けて引くのね。"],["ずんだもん","そうなのだ。分母は換算量から仕損の200を引いて、月末の1,000個分で724,800なのだ。"],["めたん","足した1,536,800が、仕掛品Aの次月繰越になるわ。"]],[["ずんだもん","仕損品の欄は、売れる値段で仕損品を勘定から抜き出すのだ。996円に400個を掛けて、398,400なのだ。"],["めたん","完成品は、月初と当月を足して、次月繰越と仕損品を引いた残りね。"],["ずんだもん","そうなのだ。製品Aの欄は14,001,800なのだ。"],["めたん","仕掛品Aの7つの欄は、3回目の答案で全部合ってたわ。"],["ずんだもん","負担先の判定が通ったので、Aは最後まで行けたのだ。"]],[["ずんだもん","次は製品Bの次月繰越なのだ。完成品のみ負担なので、Aとやり方が変わるのだ。"],["めたん","月末仕掛品は仕損の地点まで来てないから、仕損の原価を持たせないのね。"],["ずんだもん","そうなのだ。分母は当月投入の8,200のまま、仕損も含めて割るのだ。"],["めたん","仕損品評価額も、ここでは引かないわね。"],["ずんだもん","引かないのだ。仕損の原価は全部完成品に残るので、評価額も完成品から引くのだ。"],["めたん","加工費は、換算量7,900のうち月末の100個分で、70,000ね。"],["ずんだもん","足して480,000が次月繰越なのだ。ここも3回目の答案で合っていたのだ。"]],[["ずんだもん","3回目の答案で落としたのは、仕損品Bの欄なのだ。"],["めたん","Bは完成品のみ負担だから、非度外視法と同じと考えたわ。材料分の894は300個に、加工分の240は換算量の200に掛けたのよ。"],["ずんだもん","それで316,200になったのだ。一度は正しい340,200を書いていたのに、消して書き換えていたのだ。"],["めたん","えっ、最初に書いたほうが合ってたのね。"],["ずんだもん","評価額は、仕損品が1個いくらで売れるかなのだ。売れる物は300個あるので、材料分も加工分も300個に掛けるのだ。"],["めたん","換算量は、原価を按分するときだけに使う数ね。"],["ずんだもん","そうなのだ。両者負担でも完成品のみ負担でも、評価額に掛けるのは個数なのだ。"],["ずんだもん","1回目の下書きでも、AとBの両方で、加工分に換算量を掛けていたのだ。3回目のAでは、231を400個に掛けて直せていたのだ。"],["めたん","分けずに1,134に300個を掛ければ、340,200になるわね。"],["ずんだもん","そうなのだ。完成品は、月初と当月から次月繰越と仕損品を引いて、12,197,200なのだ。"],["めたん","答案の製品Bは12,221,200で、ちょうど24,000多かったわ。"],["ずんだもん","仕損品を24,000少なくした分が、そのまま完成品に回ったのだ。貸借は合うので、検算では見つからないのだ。"]],[["ずんだもん","最後は問2、製造間接費の配賦差異を、予算差異と操業度差異に分けるのだ。"],["めたん","合計の差異は、予定配賦額と実際発生額の差で、12,000の借方ね。"],["ずんだもん","そうなのだ。AとBの予定配賦額を足した9,048,000より、実際が12,000多いので不利差異なのだ。"],["めたん","3回目の答案では、予算差異を40,000にして、操業度差異は合計との差で52,000にしたわ。"],["ずんだもん","余白の図の数字は全部正しかったのだ。答えの欄に移すときに、ずれてしまったのだ。"],["ずんだもん","予算差異は、予算許容額と実際発生額の差なのだ。"],["めたん","予算許容額って、実際の作業時間なら本来これだけかかるはず、という額よね。"],["ずんだもん","そうなのだ。月の固定費予算に、300円掛ける実際の11,310時間を足して、9,143,000なのだ。"],["めたん","実際の9,060,000のほうが少ないから、83,000の貸方ね。"],["ずんだもん","操業度差異は、基準操業度と実際の時間の差に、固定費率の500を掛けるのだ。"],["めたん","月の基準は138,000時間を12で割った11,500時間ね。実際は190時間足りないから、95,000の借方になるわ。"],["ずんだもん","正解なのだ。83,000の有利から95,000の不利を引くと、合計の12,000の不利に戻るのだ。"],["めたん","差額で埋めずに、2つとも出してから合計で確かめるのね。1回目の答案では、ここは完答だったわ。"]],[["ずんだもん","最後に、解き方をまとめるのだ。"],["ずんだもん","1つ目、仕損の発生点と月末仕掛品の進捗度を、製品ごとに比べるのだ。通っていれば両者負担、通っていなければ完成品のみ負担なのだ。"],["めたん","2つ目、両者負担なら評価額を当月投入から引いて、仕損を分母から除いて按分するのね。完成品のみ負担なら、月末は仕損を含めたまま割るわ。"],["ずんだもん","3つ目、仕損品評価額は、材料分も加工分も仕損の個数に掛けるのだ。換算量は使わないのだ。"],["めたん","配賦差異は、予算差異と操業度差異を別々に出して、合計で検算する、ね。"],["ずんだもん","完璧なのだ。講義10-1の、直労まで分かれば組直接費を賦課する場面もあわせて見ておくのだ。"]]],"shorts":[{"hl":"月末が発生点を/[通ったか]で決める","at":89.84,"blob":"a940d667be00b4e13759d4cb155f891b"},{"hl":"評価額は/[個数]に掛ける","at":244.73,"blob":"276b8e5eeacbf2891baab015a4c366e0"},{"hl":"差額で埋めずに/[2つとも出す]","at":304.68,"blob":"d57231959e7de6761e0bdcf5930d2311"},{"hl":"寸劇：月末が発生点を/[通ったか]で決める","at":89.84,"blob":"a21bc1c6f155942766385b6c072db12a"},{"hl":"寸劇：評価額は/[個数]に掛ける","at":244.73,"blob":"84a373a6752d2894919e387437d3037d"},{"hl":"寸劇：差額で埋めずに/[2つとも出す]","at":304.68,"blob":"8ac4167e8d621ebf026e6d929ad6c720"}],"zabout":["工原10-1は、製品AとBの組別総合原価計算で、仕掛品勘定と製造間接費の配賦差異を出す問題なのだ。","製造間接費は直接作業時間で予定配賦率800円なのだ。仕損は、Aは月末仕掛品が発生点を通るので両者負担、Bは通らないので完成品のみ負担なのだ。","製品Aは14,001,800、製品Bは12,197,200なのだ。仕損品評価額は材料分も加工分も個数に掛けるので、Bは1,134円×300個で340,200なのだ。","配賦差異は予算差異83,000の貸方、操業度差異95,000の借方で、合計12,000の借方なのだ。"]},{"kind":"prob","id":"pK11-1","no":"工原11-1","title":"完成品原価按分法","sub":"工原","ch":11,"probs":[],"w":0.258,"wt":["最初に紙に書いた数字が、その後の判断の前提として固定される"],"hl":"完成品原価を[1つ出してから]積数で分ける/足し戻して検算","acct":"工原","lec":["k11-1"],"video":{"blob":"10284e67135d1aa21b8d13ef630495ce","secs":282.96,"mb":3.4},"scenes":[[0,"問題の資料"],[39.94,"資料3の指示：等価係数"],[72.78,"ボックス図：仕損の40個を除く"],[105.12,"月末仕掛品原価"],[135.27,"完成品総合原価：分ける前の1つの数字"],[157.69,"AとBに分ける：積数"],[188.73,"B：隣の数字を書いた"],[221.38,"B：正しい答えと検算"],[252.61,"まとめ"]],"script":[[["ずんだもん","今回は、工原の問題集11-1、完成品原価按分法の問題を解説するのだ。"],["めたん","等級別総合原価計算って、単純総合とどう違うのかしら。"],["ずんだもん","同じ種類の製品を、大きさや重さだけ変えて作るときの原価計算なのだ。"],["ずんだもん","たとえば同じ味のコーラを、ペットボトルと缶に詰め分ける感じなのだ。"],["めたん","中身は同じで、入れ物の大きさだけが違うのね。"],["ずんだもん","生産データの形は、単純総合と同じなのだ。完成品1,000個の内訳は、Aが600個、Bが400個なのだ。"],["めたん","正常仕損が40個あって、発生点は25%になってるわ。"],["ずんだもん","月末仕掛品は120個で、進捗度は50%なのだ。"],["めたん","原価データは、原料費と加工費に分けて書いてあるわ。"],["ずんだもん","求めるのは、AとBそれぞれの完成品総合原価と完成品単位原価、全部で4つの欄なのだ。"]],[["めたん","完成品の等価係数は、製品Aが1で、製品Bが0.7になってるわ。"],["ずんだもん","等価係数は、製品の大きさや重さを比率にしたものなのだ。Bは、Aの0.7個分と数えるのだ。"],["めたん","500ミリのペットボトルと350ミリの缶なら、1対0.7ってことね。"],["ずんだもん","大事なのは、『完成品の』等価係数と書いてあることなのだ。"],["めたん","完成品にだけ使う、ってことかしら。"],["ずんだもん","そうなのだ。月末仕掛品には等価係数を使わないのだ。これが完成品原価按分法なのだ。"],["めたん","タンクの中身は全部同じだから、まず完成品の原価を1つ出して、下ろすときにAとBに分けるのね。"],["ずんだもん","その通りなのだ。だから計算の前半は、ふつうの単純総合原価計算なのだ。"]],[["ずんだもん","まずボックス図なのだ。原料費は個数、加工費は進捗度を掛けた数で書くのだ。"],["めたん","月初の160個は50%だから、加工費では80個分になるわ。"],["ずんだもん","正常仕損は40個で、加工費では10個分なのだ。"],["めたん","仕損は25%の所で出て、月末仕掛品は50%まで進んでるわね。"],["ずんだもん","そうなのだ。月末仕掛品も仕損の点を通っているので、完成品と月末仕掛品の両方で負担するのだ。"],["ずんだもん","度外視法なので、40個は最初から無かったものとして割るのだ。"],["めたん","答案の下書きでも、当月投入を960個、加工費で980個分に直してたわ。"],["ずんだもん","そこは合っていたのだ。仕損の分を、投入から引いておけばよいのだ。"]],[["ずんだもん","次は月末仕掛品原価なのだ。平均法なので、月初と当月の原価を足して、個数の割合で分けるのだ。"],["めたん","原料費は、月初と当月を足して、仕損を除いた個数で割るのね。月末の120個分を取るわ。"],["ずんだもん","原料費は237,600なのだ。"],["めたん","加工費は、分母も分子も、進捗度を掛けた数を使うのね。"],["ずんだもん","そうなのだ。月末の60個分を、仕損の10個分を除いた合計で割って、39,600なのだ。"],["めたん","答案の下書きにも、237,600と39,600が出てたわ。"],["ずんだもん","どちらも合っていたのだ。合わせて、月末仕掛品原価は277,200なのだ。"]],[["ずんだもん","ここで、完成品全体の原価を1つにまとめるのだ。"],["めたん","月初と当月の原価を全部足して、月末仕掛品の277,200を引くのね。"],["ずんだもん","完成品総合原価は2,640,000なのだ。これが、AとBに分ける前のタンクの中身なのだ。"],["めたん","答案では、ここを1つにまとめないで、原料費と加工費を別々に出してたわ。"],["ずんだもん","分ける比率は同じなので、別々でも答えは合うのだ。ただ、似た大きさの数字が並ぶので、取り違えやすくなるのだ。"]],[["ずんだもん","次は、2,640,000をAとBに分けるのだ。使うのは積数なのだ。"],["めたん","積数って何？"],["ずんだもん","完成品の個数に、等価係数を掛けたものなのだ。AとBを、同じものさしの個数に直した数なのだ。"],["めたん","Aは600個に1を掛けて600、Bは400個に0.7を掛けて280ね。"],["ずんだもん","合わせて880なのだ。Aの取り分は、880のうちの600なのだ。"],["めたん","Aの完成品総合原価は、1,800,000になるわ。"],["ずんだもん","600個で割って、Aの単位原価は3,000なのだ。"],["めたん","Aの2つの欄は、答案でも合ってたわ。"],["ずんだもん","正解なのだ。答案では、原料費と加工費を別々に分けて足していたのだ。"]],[["めたん","Bは、答案で660,000にしたわ。単位原価は、400個で割って1,650になるわ。"],["ずんだもん","そこが違うのだ。660,000は、Bの原価ではないのだ。"],["めたん","下書きだと、原料費の完成品が1,980,000で、加工費の完成品が660,000だったわ。"],["ずんだもん","そうなのだ。660,000は、加工費の完成品原価の全体なのだ。AとBに分ける前の数字なのだ。"],["めたん","隣にあった数字を、そのまま解答欄に書いちゃったのね。"],["ずんだもん","Bの原価は、原料費のBの分と、加工費のBの分を足すのだ。"],["めたん","原料費のBが630,000、加工費のBが210,000で、足して840,000になるわ。"],["ずんだもん","それが正解なのだ。下書きには、正しい数字が両方出ていたのだ。"]],[["ずんだもん","積数で一度に分けても、Bは2,640,000の880分の280で、840,000なのだ。"],["めたん","400個で割って、Bの単位原価は2,100になるわ。"],["ずんだもん","検算のしかたが2つあるのだ。1つ目は、AとBを足して、分ける前の2,640,000に戻るかなのだ。"],["めたん","1,800,000と840,000を足して、ちゃんと2,640,000ね。答案の660,000だと、18万足りないじゃない。"],["ずんだもん","2つ目は、Bの単位原価が、Aの0.7倍になっているかなのだ。"],["めたん","Aの単位原価に0.7を掛けて、2,100ね。答案の単位原価だと合わないわ。"],["ずんだもん","その通りなのだ。どちらか1つでもやれば、取り違えに気づけたのだ。"]],[["ずんだもん","最後に、解き方をまとめるのだ。"],["ずんだもん","1つ目、完成品原価按分法は、まず単純総合原価計算で、完成品総合原価を1つ出すのだ。月末仕掛品には等価係数を使わないのだ。"],["めたん","2つ目、完成品の個数に等価係数を掛けた積数で、AとBに分けるのね。"],["ずんだもん","3つ目、分けたら足し戻して、元の完成品総合原価に戻るか確かめるのだ。Bの単位原価は、Aの0.7倍になるのだ。"],["めたん","解答欄に書く前に、その数字が何の数字か確かめる、ね。"],["ずんだもん","完璧なのだ。講義11-1の、同じ味のコーラを重さの比1対0.7で分ける場面も、あわせて見ておくのだ。"]]],"shorts":[{"hl":"分けたら/[足し戻して]確かめる","at":188.73,"blob":"bd77a986fe69c5fd818b9b4104f4e19e"},{"hl":"寸劇：分けたら/[足し戻して]確かめる","at":188.73,"blob":"d55207a31ec7793e67e1b484d1cc989b"}],"zabout":["工原11-1は、等級別総合原価計算の完成品原価按分法で、AとBの完成品総合原価と単位原価を出す問題なのだ。","月末仕掛品には等価係数を使わず、単純総合原価計算で完成品総合原価2,640,000を1つ出すのだ。","それを積数（A 600個×1、B 400個×0.7）で分けて、Aは1,800,000・単位3,000、Bは840,000・単位2,100なのだ。"]},{"kind":"prob","id":"pK12-1","no":"工原12-1","title":"分離点推定市価基準（正常市価基準）①","sub":"工原","ch":12,"probs":[],"w":0.0,"wt":[],"hl":"分離点の後は[実際追加加工費]をそのまま足す","acct":"工原","lec":["k12-1"],"video":{"blob":"36306fbd643544a5a1e7075f4c160b84","secs":222.26,"mb":2.6},"scenes":[[0,"問題の資料"],[32.8,"問1：第1工程のボックス図"],[87.26,"問2：正常市価の比で按分する"],[129.36,"問2：分離後はボックスへ転がす"],[177.56,"講義の板書と同じ形"],[198.48,"まとめ"]],"script":[[["ずんだもん","今回は、工原の問題集12-1、分離点推定市価基準の問題を解説するのだ。"],["めたん","名前が長すぎるわよ。そもそも、連産品って何？"],["ずんだもん","同じ原料から、同じ工程で、必ず一緒にできてしまう別々の製品なのだ。牛一頭から、ロースとヒレが同時に取れるようなものなのだ。"],["めたん","この問題だと、第1工程を終えたところで、連産品のAとBとCに分かれるのね。"],["ずんだもん","そうなのだ。分かれる地点を分離点、分離点までにかかった共通の原価を連結原価というのだ。"],["めたん","共通だから、どれがどの製品の分か分からないわよね。それで、何かの比で按分するのね。"],["ずんだもん","その通りなのだ。今日は、講義12-1と同じ形の下書きで解いていくのだ。"]],[["ずんだもん","問1は、第1工程の月末仕掛品原価と、連結原価の2つの欄なのだ。"],["めたん","原料は始点投入で、先入先出法ね。答案でもボックス図を書いたわ。"],["ずんだもん","ボックスの左に期首と当期投入、右に完成と期末を置くのだ。かっこの中は、加工費の換算量なのだ。"],["めたん","期首は1,200キロの40%で480、期末は1,600キロの60%で960になるわ。"],["ずんだもん","当期投入の加工費の換算量は、差し引きで32,480なのだ。"],["めたん","先入先出法だから、期末は当期投入の単価で出すのね。"],["ずんだもん","そうなのだ。原料費5,524,200を32,400で割って、1キロ170.5円なのだ。"],["めたん","期末の1,600キロに掛けて、原料費は272,800になるわ。"],["ずんだもん","加工費は3,731,952を32,480で割って114.9円、960を掛けて110,304なのだ。"],["めたん","足して、期末は383,104ね。答案でも合ってたわ。"],["ずんだもん","正解なのだ。完成の方は、全部の原価から期末を引いて、連結原価9,113,600なのだ。ここも合っていたのだ。"]],[["ずんだもん","問2は、連結原価を正常市価の比で按分して、各連産品の完成品原価を出すのだ。"],["めたん","正常市価って、ふつうの売値のことかしら。"],["ずんだもん","ここでは、分離点での推定の売値なのだ。講義でNRVと呼んでいたものなのだ。"],["めたん","でも、BとCは分離したあとに加工してから売るのね。分離点の売値なんて、付いてないじゃない。"],["ずんだもん","だから、加工後の売値から見積追加加工費を引いて逆算するのだ。まだ加工していないので、見積の額を使うのだ。"],["めたん","Bは720から80を引いて640、Cは800から100を引いて700ね。答案の横にも書いたわ。"],["ずんだもん","それに生産量を掛けた、合計20,480,000の比で、連結原価の9,113,600を分けるのだ。"],["めたん","Aは1,600,000の割合だから、712,000ね。答案でも合ってたわ。"],["ずんだもん","正解なのだ。BとCも同じように按分した額が、表の右の列なのだ。"]],[["めたん","答案では、Bは3,417,600、Cは4,984,000を答えにしたわ。これで終わりよね。"],["ずんだもん","そこが違うのだ。BとCは、分離したあとにもう一度加工しているのだ。"],["ずんだもん","講義と同じように、分離後は製品ごとにボックスを1つ描くのだ。左上に、按分した額を前工程費として入れるのだ。"],["めたん","じゃあ、左下には何を入れるのかしら。"],["ずんだもん","左下に、実際追加加工費を入れるのだ。Bなら1キロ80.4円に12,000キロを掛けて、964,800なのだ。"],["めたん","前工程費と足して、Bの完成品原価は4,382,400になるわ。"],["ずんだもん","Cも同じで、4,984,000に1,616,000を足して、6,600,000なのだ。"],["めたん","Aは分離後の加工が無いから、712,000のままね。"],["ずんだもん","ボックスに転がす形で描けば、左下の欄が空いているのに気づけるのだ。答案では、実際追加加工費を一度も使っていなかったのだ。"],["めたん","見積は按分の比を作るため、実際は原価に足すため、ってことね。"],["ずんだもん","その通りなのだ。"]],[["ずんだもん","講義12-1の板書も、この形だったのだ。ロースとヒレの按分額を、第2工程と第3工程のボックスの左上に入れて、左下に実際加工費を足して転がしていたのだ。"],["めたん","数字は違うけど、下書きの形は同じね。"],["ずんだもん","そうなのだ。講義では、NRVを出すときは予定の加工費、原価を出すときは実際の加工費、と注意していたのだ。"],["めたん","この問題の、見積と実際の使い分けと同じ話ね。"]],[["ずんだもん","最後に、解き方をまとめるのだ。"],["ずんだもん","1つ目、第1工程はボックス図で、連結原価を出すのだ。"],["めたん","2つ目、按分の比は正常市価ね。見積追加加工費を引いて逆算するわ。"],["ずんだもん","3つ目、分離後は製品ごとのボックスへ転がすのだ。左上に前工程費、左下に実際加工費なのだ。"],["めたん","按分するのは分離点の前だけ、後はボックスに足して転がす、ね。"],["ずんだもん","完璧なのだ。講義12-1の、按分額に実際加工費を足して転がす場面もあわせて見ておくのだ。"]]],"shorts":[{"hl":"分離後の加工費は/[按分せず足す]","at":129.36,"blob":"f5a1c2cf032f37d646451ddf56dbf0aa"},{"hl":"[見積]は按分の比・/[実際]は原価に足す","at":87.26,"blob":"ba7a8d04d00cc2c8ccae6757e6cc62f1"},{"hl":"寸劇：分離後の加工費は/[按分せず足す]","at":129.36,"blob":"c2a0b1364cda1b22117492e40cc0dd16"},{"hl":"寸劇：[見積]は按分の比・/[実際]は原価に足す","at":87.26,"blob":"7f6dd0545de378b1f75092767e2b4a2f"}],"zabout":["工原12-1は、連産品の連結原価を正常市価の比で按分して、各連産品の完成品原価を出す問題なのだ。","問1は先入先出法で、月末仕掛品原価383,104、連結原価9,113,600なのだ。","問2は、見積販売単価から見積追加加工費を引いた正常市価の比で按分するのだ。分離後に加工するBとCには実際追加加工費を足して、Aは712,000、Bは4,382,400、Cは6,600,000なのだ。"]},{"kind":"prob","id":"pK16-4","no":"工原16-4","title":"売上構成差異・売上数量差異","sub":"工原","ch":16,"probs":[],"w":0.0,"wt":[],"hl":"差異は[実際から予算]を引く/向きが割れる方が構成差異","acct":"工原","lec":["k16-4"],"video":{"blob":"d75c439966d0fccff3641c421ff3aa47","secs":254.9,"mb":3.1},"scenes":[[0,"問題の資料"],[39.19,"3つの数量を並べる"],[68.9,"問1：予算貢献利益を掛ける"],[90.33,"問1：構成差異は実際から引く"],[132.96,"問1：数量差異は真ん中から予算を引く"],[158.24,"問1：解答欄の行を取り違えない"],[188.7,"問2：予算販売価格を掛ける"],[226.88,"まとめ"]],"script":[[["ずんだもん","今回は、工原の問題集16-4、売上構成差異と売上数量差異の問題を解説するのだ。"],["めたん","予算では、製品Xを500個、製品Yを1,000個売る予定だったのね。"],["ずんだもん","実際には、Xが690個、Yが930個売れたのだ。"],["めたん","これを、販売数量差異から売上品構成差異と売上品数量差異に分ける問題ね。"],["ずんだもん","販売数量差異は、売れた個数が予算とずれたせいで、利益がどれだけ変わったかを表す差異なのだ。"],["めたん","それを2つに割るってこと？"],["ずんだもん","そうなのだ。売る割合のずれが売上品構成差異、売った総数のずれが売上品数量差異なのだ。"],["めたん","予算ではXとYを1対2で売るはずだったのに、実際はそうなってない、ってことね。"],["ずんだもん","それと、不利差異にはマイナスを付ける指示があるのだ。答案は三角で書いていたので、指示どおりマイナスで書くのだ。"]],[["ずんだもん","解き方は、横に数量を3つ並べるのだ。"],["めたん","予算数量と実際数量、それと真ん中の、実際数量・予算割合ね。"],["ずんだもん","真ん中は、実際に売れた合計を、予算の割合で割り直した数量なのだ。"],["めたん","実際の合計は、690と930を足して1,620個ね。"],["ずんだもん","予算の割合は、500個と1,000個なので1対2なのだ。"],["めたん","1,620個の3分の1で、Xは540個になるわ。"],["ずんだもん","Yは3分の2で、1,080個なのだ。"],["めたん","540個と1,080個は、答案の下書きでも出せてたわ。"],["ずんだもん","そうなのだ。この3つの数量が並べば、あとは引き算と掛け算だけなのだ。"]],[["ずんだもん","問1は、予算貢献利益に基づいて出すのだ。"],["めたん","予算貢献利益って、予算の販売単価から予算の変動費を引いた、1個あたりの儲けよね。"],["ずんだもん","その通りなのだ。Xは1,000から600を引いて400、Yは500から300を引いて200なのだ。"],["めたん","実績の販売単価と変動費は、使わないのね。"],["ずんだもん","そうなのだ。値段や変動費のずれは、別の差異で数えるのだ。ここは数量のずれだけを、予算の単価で測るのだ。"]],[["ずんだもん","まず売上品構成差異なのだ。実際数量と、真ん中の数量の差を使うのだ。"],["めたん","答案の下書きでは、540から690を引いたわ。だからXはマイナス60,000になったの。"],["ずんだもん","そこが1つ目の違いなのだ。差異は、いつも実際の側から予算の側を引くのだ。"],["めたん","予算から実際を引くんじゃなかったかしら。"],["ずんだもん","それは原価の分析なのだ。原価は実際に多くかかると不利なので、予算から実際を引くのだ。"],["ずんだもん","いまは利益の分析なのだ。実際に多く売れたら有利なので、向きがひっくり返るのだ。"],["めたん","Xは予算の割合で売るより150個多く売れたから、有利になるはずね。"],["ずんだもん","そうなのだ。150個に400を掛けて、プラス60,000なのだ。"],["めたん","Yは930から1,080を引くと150個足りないわ。200を掛けて、マイナス30,000ね。"],["ずんだもん","正解なのだ。Xが有利でYが不利、向きが割れるのが構成差異なのだ。"],["めたん","割合の取り合いだから、片方が増えたら片方は減るのね。"]],[["ずんだもん","次は売上品数量差異なのだ。真ん中の数量と、予算数量の差を使うのだ。"],["めたん","Xは540から500を引いて40個、Yは1,080から1,000を引いて80個ね。"],["ずんだもん","Xは40個に400を掛けて、16,000なのだ。"],["めたん","Yも80個に200を掛けて、16,000になるわ。"],["ずんだもん","どちらもプラスなのだ。合計で予算より120個多く売れたので、両方とも有利なのだ。"],["めたん","数量差異は、全部の製品で向きがそろうのね。"],["ずんだもん","そうなのだ。差異の大きさは、答案でも8つとも合っていたのだ。"]],[["ずんだもん","ここからが2つ目の違いなのだ。解答欄の上の行は、売上品構成差異なのだ。"],["めたん","答案では、上の構成差異の行に、数量差異の数字を書いてたわ。"],["ずんだもん","下書きの図には、構成と数量の印がちゃんと付いていたのだ。解答欄に書き写すときに、行が入れ替わったのだ。"],["めたん","書く前に、どっちの行か確かめればいいのね。"],["ずんだもん","見分け方があるのだ。XとYで向きが割れている方が構成差異、そろっている方が数量差異なのだ。"],["めたん","16,000が2つそろってるから、こっちが数量差異ね。"],["ずんだもん","そうなのだ。もう1つ、Xは予算より多く売れているのに、Xの両方にマイナスが付いていたら、向きを疑うのだ。"]],[["ずんだもん","問2は、予算販売価格に基づいて出すのだ。"],["めたん","横に並べる数量は、問1と同じでいいの？"],["ずんだもん","同じなのだ。掛ける単価が、予算貢献利益から予算の販売単価に変わるだけなのだ。"],["めたん","構成差異のXは、150個に1,000を掛けて、プラス150,000ね。"],["ずんだもん","Yは150個足りないので、500を掛けて、マイナス75,000なのだ。"],["めたん","数量差異のXは、40個に1,000を掛けて、40,000になるわ。"],["ずんだもん","Yは80個に500を掛けて、こちらも40,000なのだ。"],["めたん","答案では、ここも行が入れ替わって、向きも逆だったわ。"],["ずんだもん","問1と同じ所なのだ。大きさは合っていたので、直すのは向きと行だけなのだ。"],["めたん","指示が無かったら、どっちの単価を使うのかしら。"],["ずんだもん","指示が無ければ、予算貢献利益なのだ。売上が増えればコストも増えるので、影響は利益に出るからなのだ。"]],[["ずんだもん","最後に、解き方をまとめるのだ。"],["ずんだもん","1つ目、数量を3つ並べるのだ。予算数量、実際の合計を予算の割合で割り直した数量、実際数量なのだ。"],["めたん","2つ目、差異はいつも実際の側から予算の側を引くのね。多く売れたら有利よ。"],["ずんだもん","3つ目、実際と真ん中の差が構成差異、真ん中と予算の差が数量差異なのだ。掛けるのは、指示された予算の単価なのだ。"],["めたん","書く前に、向きが割れている方が構成差異、そろっている方が数量差異、と確かめるわ。"],["ずんだもん","完璧なのだ。講義16-4の、数量を3つ並べて分ける場面もあわせて見ておくのだ。"]]],"shorts":[{"hl":"利益の差異は/[実際−予算]","at":90.33,"blob":"a8c50dad4eb19a6d5557a4b20a1fed80"},{"hl":"向きが[割れる]のが構成・/[そろう]のが数量","at":158.24,"blob":"3ea9b61b89db19327e26a621b6af9205"},{"hl":"寸劇：利益の差異は/[実際−予算]","at":90.33,"blob":"e53edc02b93603c3f2285ee1b231589c"},{"hl":"寸劇：向きが[割れる]のが構成・/[そろう]のが数量","at":158.24,"blob":"5050efda2c06c5a7151d21eee956db7f"}],"zabout":["工原16-4は、販売数量差異を売上品構成差異と売上品数量差異に分ける問題なのだ。","予算数量・実際合計を予算割合で割り直した数量（Xが540個、Yが1,080個）・実際数量の3つを並べるのだ。","問1は予算貢献利益で、構成差異はXプラス60,000・Yマイナス30,000、数量差異は両方プラス16,000なのだ。問2は予算販売価格で、構成差異はX 150,000・Yマイナス75,000、数量差異は両方40,000なのだ。"]}]};
const MOCK = !!DATA.mock;
// アカウント＝アーティファクト1つ（アカウント.json）。本番の1枚は自分のアカウントの分だけを持つ。
// モックは全アカウントぶんを持ち、切り替えは同じページの中（選んだアカウントを端末に覚えて読み直す）

// 解説キャラはアカウントごと（本人 2026-09-29「工原はずんだもん、商会は別のキャラ、みたいな感じで解説するキャラを変えるかもしれない」）。
// 顔（アカウント.json の chara.face）があれば、サムネイルの丸・マイページ・切り替え画面の顔をそれにする。無ければずんだもん（build.py が埋める顔）

const isExam = v => v.kind === "exam";
// 問題集の問題の解説動画（2026-09-29〜。ID は pK19-5、no は 工原19-5）。章は講義と同じ並びに入る
const isProb = v => v.kind === "prob";
